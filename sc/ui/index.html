<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>LC XL 3</title>
<style>
/* Controller mirror after UI-REDESIGN.md and reference/layout-mockup.html: two LC panels (Mode 1, Mode 2), the Launchkey
   under Mode 1, the spectrum and the status strip under Mode 2. Everything is laid out on a design board of 1600 x 900
   units and scaled as one piece (--px = one unit in CSS px); only text has a floor and a ceiling. Two styles, "minimal"
   (Torso-like, default) and "retro" (Teenage Engineering-like), each dark or light (data-tone): only tokens and the knob
   component differ.
   Flat: no gradients, shadows, glow or blur. Nothing dims except button text. */
:root{--W:1600;--H:900}
body,body[data-theme=minimal]{--bg:#0b0b0b;--text:#F1EFE8;--off:#5F5E5A;--track:#2C2C2A;--accent:#F1EFE8;--handle:#F1EFE8;
  --edge:#2C2C2A;--frame:#F1EFE8;--hit:#F1EFE8;--keyW:#2C2C2A;--keyB:#0b0b0b;--keyLine:transparent;--keyLab:#8A8A8A;--padF:#2C2C2A;--padLine:transparent;--wheelF:#8A8A8A;
  --font:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
body[data-theme=retro]{--bg:#D3D1C7;--text:#2C2C2A;--off:#888780;--track:#B4B2A9;--accent:#D85A30;--handle:#D85A30;
  --edge:#B4B2A9;--frame:#2C2C2A;--hit:#D85A30;--keyW:#F1EFE8;--keyB:#2C2C2A;--keyLine:#B4B2A9;--keyLab:#888780;--padF:#B4B2A9;--padLine:transparent;--wheelF:#2C2C2A;
  --font:-apple-system,system-ui,"Helvetica Neue",Helvetica,Arial,"DejaVu Sans",sans-serif}
/* light minimal and dark retro (user, 2026-11-21): same components, other tokens */
body[data-theme=minimal][data-tone=light]{--bg:#F4F3EE;--text:#1A1A18;--off:#8A8984;--track:#DCDAD3;--accent:#1A1A18;--handle:#1A1A18;
  --edge:#DCDAD3;--frame:#1A1A18;--hit:#1A1A18;--keyW:#FFFFFF;--keyB:#3A3A37;--keyLine:#DCDAD3;--keyLab:#8A8984;--padF:#E6E4DD;--padLine:transparent;--wheelF:#8A8984}
body[data-theme=retro][data-tone=dark]{--bg:#232321;--text:#F1EFE8;--off:#888780;--track:#3D3C39;--accent:#D85A30;--handle:#D85A30;
  --edge:#3D3C39;--frame:#F1EFE8;--hit:#D85A30;--keyW:#D3D1C7;--keyB:#232321;--keyLine:transparent;--keyLab:#888780;--padF:#3D3C39;--padLine:transparent;--wheelF:#F1EFE8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
/* everything on the panel is lower case (user, 2026-11-20): pattern and chord names, status, Launchkey, pads */
body{text-transform:lowercase}button,input,select{text-transform:inherit}
body{display:flex;align-items:center;justify-content:center;color:var(--text);font-family:var(--font);line-height:1.4;
  user-select:none;-webkit-user-select:none;
  --px:min(calc(96vw / var(--W)), calc(94vh / var(--H)));
  --fs-name:clamp(13px, calc(20 * var(--px)), 32px);
  --fs-btn:clamp(11px, calc(18 * var(--px)), 28px);
  --fs-lab:clamp(11px, calc(16 * var(--px)), 24px);
  --fs-knob:clamp(11px, calc(14 * var(--px)), 21px)}
.wait{font-size:var(--fs-lab);color:var(--accent)}
.board{width:calc(var(--W) * var(--px));display:flex;flex-direction:column;gap:calc(32 * var(--px))}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(40 * var(--px))}
.pair>section{min-width:0;display:flex;flex-direction:column}
.lab{display:flex;gap:.6em;font-size:var(--fs-lab);color:var(--off);margin:0 calc(12 * var(--px)) calc(8 * var(--px));
  white-space:nowrap;overflow:hidden;text-transform:lowercase}
.lab .hint{margin-left:auto;overflow:hidden;text-overflow:ellipsis;opacity:.6}
.lab .pad-name{color:var(--text)}
/* each controller is its own panel with a subtle edge; the one moved last is framed (off with the player's LC frame off) */
.pn{padding:calc(14 * var(--px)) calc(12 * var(--px));border:1px solid var(--edge);border-radius:calc(10 * var(--px))}
body:not(.noframe) .pn.live{border-color:var(--frame)}
.gr{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:calc(4 * var(--px));align-items:start}
.cl{display:flex;flex-direction:column;align-items:center;min-width:0;gap:calc(14 * var(--px))}
.cl.global{box-shadow:-1px 0 0 0 var(--track)}
.name{font-size:var(--fs-name);font-weight:500;color:var(--text);max-width:100%}
.name,.kl,.btn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name,.kl,.b2{text-transform:lowercase}
.kw{display:flex;flex-direction:column;align-items:center;gap:calc(3 * var(--px));min-width:0;max-width:100%}
.kl{font-size:var(--fs-knob);line-height:1.2;color:var(--off);max-width:100%}
/* knob: Minimal = arc (viewBox 24), Retro = disc with pointer (viewBox 26) */
.knob{width:calc(48 * var(--px));aspect-ratio:1;display:block;flex:none}
.kb-track,.kb-val{fill:none;stroke-width:3;stroke-linecap:round}.kb-track{stroke:var(--track)}.kb-val{stroke:var(--text)}
.kb-ptr{stroke-width:2.5;stroke-linecap:round}.kb-disc{stroke-width:1}
.r1 .kb-disc{fill:#378ADD;stroke:#378ADD}.r2 .kb-disc{fill:#1D9E75;stroke:#1D9E75}.r3 .kb-disc{fill:#F1EFE8;stroke:#888780}
.r1 .kb-ptr,.r2 .kb-ptr{stroke:#F1EFE8}.r3 .kb-ptr{stroke:#2C2C2A}
/* fader: 28 x 150 units, track max(2px, 4 units), handle 28 x 12 */
.fader{position:relative;width:calc(28 * var(--px));height:calc(130 * var(--px));margin-top:calc(4 * var(--px));flex:none}
.fader .bar{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:max(2px, calc(4 * var(--px)));background:var(--track)}
.fader .handle{position:absolute;left:0;width:100%;height:calc(12 * var(--px));border-radius:1px;background:var(--handle);
  bottom:calc(var(--v, 0) * (100% - 12 * var(--px)))}
/* minimal: the fader is a slim slot that fills from the bottom (a sliver at 0); same box as Retro, so a theme
   switch moves nothing */
body:not([data-theme=retro]) .fader .bar{width:calc(12 * var(--px));background:var(--track);border-radius:calc(6 * var(--px))}
body:not([data-theme=retro]) .fader .handle{left:50%;transform:translateX(-50%);width:calc(12 * var(--px));bottom:0;
  height:calc(var(--v, 0) * 100%);border-radius:calc(6 * var(--px));background:var(--handle)}
/* buttons: text only; button 1 = the active pattern, button 2 = its function */
.btns{display:flex;flex-direction:column;align-items:center;gap:calc(4 * var(--px));min-width:0;max-width:100%}
.btn{font-size:var(--fs-btn);max-width:100%;color:var(--off)}
.b1{color:var(--text)}.b1.dim{color:var(--off)}.b2.on{color:var(--accent)}
.blink{animation:blink 1s steps(1,end) infinite}@keyframes blink{0%{opacity:1}50%{opacity:.25}}
.off{visibility:hidden}
/* Launchkey: mod wheel left of the 8-column grid (knob over 2 pads per column), the keys under the pads */
.lk{display:grid;grid-template-columns:calc(56 * var(--px)) minmax(0,1fr);grid-template-rows:auto auto auto;
  grid-template-areas:"oct knobs" "wheel pads" "wheel keys";column-gap:calc(16 * var(--px));row-gap:calc(6 * var(--px));
  padding:calc(12 * var(--px)) calc(12 * var(--px))}
.lkknobs{grid-area:knobs}.lk .kb-track,.lk .kb-val{stroke-width:4}body:not([data-theme=retro]) .lk .kl{letter-spacing:-.03em}.lk .knob{width:calc(30 * var(--px))}
.lkpads{grid-area:pads;grid-template-rows:repeat(2,calc(30 * var(--px)));gap:calc(4 * var(--px));margin-top:calc(2 * var(--px))}
.oct{grid-area:oct}.wheel{grid-area:wheel}.keys{grid-area:keys;margin-top:calc(2 * var(--px))}
/* one corner radius for the whole Launchkey: 3 units */
.pad{width:100%;height:100%;border:0;background:var(--padF);box-shadow:inset 0 0 0 1px var(--padLine);border-radius:calc(3 * var(--px));cursor:pointer}
.pad.on{background:var(--hit);box-shadow:none}
/* octave: 'oct' and its value on one line, under it two buttons drawn like the pads (as on the Launchkey: two rubber
   buttons); the button in the direction the keys are shifted is lit, as the device's LEDs are; at a limit it dims */
.oct{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:calc(5 * var(--px));white-space:nowrap;min-width:0;font-size:var(--fs-knob);line-height:1.2;color:var(--off)}
.oct .ol{display:flex;justify-content:space-between}
.oct .row{display:grid;grid-template-columns:1fr 1fr;gap:calc(4 * var(--px))}
.oct button{display:grid;place-items:center;height:calc(22 * var(--px));background:var(--padF);border:0;padding:0;color:var(--text);cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--padLine);border-radius:calc(3 * var(--px))}
.oct button svg{width:calc(6 * var(--px));height:calc(10 * var(--px));overflow:visible}
.oct button polyline{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.oct button.on{background:var(--hit);color:var(--bg)}
.oct button:disabled{cursor:default;opacity:.35}
.oct b{font-weight:400;color:var(--text);font-variant-numeric:tabular-nums}
/* mod wheel: a rounded slot that fills from the bottom, its label under it */
.wheel{display:flex;flex-direction:column;align-items:center;gap:calc(4 * var(--px));margin-top:calc(2 * var(--px))}
.wheel .btn{color:var(--off);font-size:var(--fs-knob);line-height:1.2}
/* the keys level uses the stems' fader, as tall as pads + keys */
.wheel .fader{flex:1;height:auto;margin:0}
/* keys: white keys with real gaps, black keys shorter, between them (slightly off-centre as on a real keyboard) */
.keys{position:relative;height:calc(130 * var(--px))}
.keys i{position:absolute;top:0;font-style:normal;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.keys i.wht{height:100%;width:calc(100% / 15 - 2 * var(--px));background:var(--keyW);box-shadow:inset 0 0 0 1px var(--keyLine);color:var(--keyLab);
  font-size:var(--fs-knob);line-height:1.6;z-index:1;border-radius:0 0 calc(3 * var(--px)) calc(3 * var(--px))}
.keys i.blk{height:60%;width:calc(100% / 15 * .58);background:var(--keyB);z-index:2;border-radius:0 0 calc(3 * var(--px)) calc(3 * var(--px))}
.keys i.on{background:var(--hit);box-shadow:none}.keys i.wht.on{color:var(--bg)}
body.no-lk .lkbox{visibility:hidden}
/* under Mode 2: the spectrum and, right of it, the set view (300 units wide), the status strip on one line under both
   (it ends level with the Launchkey box); both boxes the same height, nothing moves when the set view switches */
.duo{flex:1;display:grid;grid-template-columns:minmax(0,1fr) calc(300 * var(--px));gap:calc(28 * var(--px));min-height:0}
.duo>div{display:flex;flex-direction:column;min-width:0;min-height:0}
.spec{flex:1;display:flex;flex-direction:column;justify-content:center;padding:calc(14 * var(--px)) calc(12 * var(--px));border:1px solid var(--edge);border-radius:calc(10 * var(--px));min-height:0}
.spec canvas{display:block;width:100%;height:calc(190 * var(--px));flex:none}
.setlab{font:inherit;background:none;border:0;padding:0;color:inherit;cursor:pointer;white-space:nowrap}
.head{padding:calc(8 * var(--px)) calc(12 * var(--px)) 0;display:flex;flex-direction:column;gap:calc(2 * var(--px));
  font-size:var(--fs-lab);line-height:1.4;min-width:0}
/* two lines: chapter / chords / break / global knobs, then bar marks, beats, chord and the theme switch */
.head .row{display:flex;gap:calc(18 * var(--px));align-items:baseline;white-space:nowrap;overflow:hidden;min-width:0}
.head .row>div{min-width:0;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.head .row>div.keep{flex-shrink:0}
.head .k{color:var(--off);margin-right:.5em;text-transform:lowercase}.head .next{color:var(--off)}
.warn{color:var(--accent);font-weight:600}
.marks i{display:inline-block;background:var(--track);margin-left:max(2px, calc(4 * var(--px)));vertical-align:middle}
.marks.beats i{width:max(5px, calc(9 * var(--px)));height:max(5px, calc(9 * var(--px)));border-radius:50%}
.marks.bars i{width:max(7px, calc(14 * var(--px)));height:max(3px, calc(6 * var(--px)));border-radius:1px}
.marks i.on{background:var(--text)}
.marks+.marks,.chord{margin-left:.5em}.marks i:first-child{margin-left:0}
.ctl{cursor:ns-resize;touch-action:none}.btn.ctl{cursor:pointer}.fader.ctl,.wheel.ctl{cursor:pointer}
</style>
</head>
<body>
<div id=lc><div class=wait>Waiting for the bridge …</div></div>
<script>
// LC view for the SuperCollider version, interactive: drag knobs (up/down; Shift = fine; double-click = 0), click or
// drag faders, press buttons (Shift-click = keep the button held until the next click). Values come from SuperCollider
// (also every move on a Launch Control); a click sends the same CC a Launch Control would send, so for the track it
// makes no difference where a move comes from. Layout and look: UI-REDESIGN.md.
// ---- theme: style 'minimal' or 'retro' (body data-theme), tone 'auto' | 'dark' | 'light'. Chosen on the player's
// page only (sidebar, Theme), saved in localStorage ce.style / ce.tone; the panel follows (message, storage event).
const STYLES = ['minimal', 'retro'], TONES = ['auto', 'dark', 'light']
const store = k => { try { return localStorage.getItem(k) } catch (e) { return null } }
const readTheme = () => {
  const old = store('ce.panelTheme')   // before 2026-11-21: black / te
  const style = STYLES.includes(store('ce.style')) ? store('ce.style') : old === 'te' ? 'retro' : 'minimal'
  return { style, tone: TONES.includes(store('ce.tone')) ? store('ce.tone') : 'auto' }
}
const darkScheme = matchMedia('(prefers-color-scheme: dark)')
let theme = readTheme()
const applyTheme = (t = theme) => {
  theme = t
  const name = STYLES.includes(t.style) ? t.style : 'minimal', tone = t.tone === 'auto' ? (darkScheme.matches ? 'dark' : 'light') : t.tone
  const changed = document.body.dataset.theme !== name || document.body.dataset.tone !== tone
  document.body.dataset.theme = name; document.body.dataset.tone = tone
  if (changed && S.layout) build()   // the knob component differs per style; canvases redraw with the tone's colours
}
darkScheme.addEventListener('change', () => applyTheme())
addEventListener('storage', e => { if (e.key === 'ce.style' || e.key === 'ce.tone') applyTheme(readTheme()) })
addEventListener('message', e => {
  if (e.origin !== location.origin) return
  if (STYLES.includes(e.data?.theme?.style) && TONES.includes(e.data.theme.tone)) applyTheme(e.data.theme)
  // the player's "LC frame" setting (key H): frame the controller moved last, or not
  if (typeof e.data?.lcFrame === 'boolean') document.body.classList.toggle('noframe', !e.data.lcFrame)
})
const retro = () => document.body.dataset.theme === 'retro', light = () => document.body.dataset.tone === 'light'

// ---- knob: Minimal = arc (viewBox 24, radius 9, 135° → 405°), Retro = disc with pointer (viewBox 26, radius 12) ----
const polar = (c, r, deg) => { const a = deg * Math.PI / 180; return [c + r * Math.cos(a), c + r * Math.sin(a)] }
const arc = (a0, a1) => { const [x0, y0] = polar(12, 9, a0), [x1, y1] = polar(12, 9, a1)
  return 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + 'A9 9 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) }
const knobSvg = () => retro()
  ? '<svg class=knob viewBox="0 0 26 26" aria-hidden="true"><circle class=kb-disc cx=13 cy=13 r=12 /><line class=kb-ptr x1=13 y1=13 x2=13 y2=13 /></svg>'
  : '<svg class=knob viewBox="0 0 24 24" aria-hidden="true"><path class=kb-track d="' + arc(135, 405) + '"/><path class=kb-val d=""/></svg>'
const setKnob = (el, v) => {
  v = Math.min(1, Math.max(0, +v || 0))
  if (el._v === v) return
  el._v = v
  const a = 135 + 270 * v, val = el.querySelector('.kb-val'), ptr = el.querySelector('.kb-ptr')
  if (val) val.setAttribute('d', v > 0.001 ? arc(135, a) : '')
  if (ptr) { const [x1, y1] = polar(13, 4, a), [x2, y2] = polar(13, 10, a); ptr.setAttribute('x1', x1); ptr.setAttribute('y1', y1); ptr.setAttribute('x2', x2); ptr.setAttribute('y2', y2) }
}

const ROWS = ['k1', 'k2', 'k3', 'fader', 'b1', 'b2']
const CC_ROW = { k1: 12, k2: 20, k3: 28, fader: 4, b1: 36, b2: 44 }   // CC = row base + column (Mode 1)
const PAGES = ['jojo', 'jonas'], PREFIX = { jojo: '16', jonas: '2' }
const S = { layout: null, cc: Array(128).fill(0), state: null, beat: null, midi: [], sc: false, page: 'jojo', bridge: false,
  lk: {}, lkBase: 48, lkLit: new Map(), lkLive: -1e9, lkPad: null,   // Launchkey: control values, keyboard window, lit keys/pads
  spec: new Float32Array(48), specAt: -1e9 }                          // the latest spectrum frame and when it came
const held = new Set()   // CCs kept held by Shift-click
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const tags = () => S.layout?.tags ?? {}
const isGlobal = n => n === 8
// CC of a control: Jojo plain, Jonas + 48 (column 8: plain on both pages, SC maps the Mode 2 CCs onto them)
const ccOf = (page, n, row) => CC_ROW[row] + n + (page === 'jonas' && n < 8 ? 48 : 0)
const tagOf = (page, n, row) => tags()[isGlobal(n) ? 'g.' + row : PREFIX[page] + ':' + n + '.' + row]
const ported = (page, n) => isGlobal(n) || ROWS.some(r => tagOf(page, n, r))
const pageOfCc = cc => cc > 52 ? 'jonas' : (cc - 4) % 8 === 0 ? S.page : 'jojo'
// panel label from the @mode tag: 'Mode 1 — Jojo: Foundation (beat + bass) · …' → 'mode 1 · foundation'
const modeLabel = page => {
  const t = tags()[PREFIX[page]] ?? '', n = page === 'jojo' ? 1 : 2
  const m = t.match(/^Mode\s*(\d+)\s*—\s*(?:[^:]*:\s*)?([^(·]+)/)
  return m ? 'mode ' + m[1] + ' · ' + m[2].trim() : 'mode ' + n
}
// a pattern without a name (SC sends its number) shows as 'pat N' (UI-REDESIGN.md "One LC column")
const patName = s => /^\d+$/.test(String(s ?? '')) ? 'pat ' + s : s

// ---- sending: coalesced per frame, one POST per batch ----
// knob/fader moves of one control collapse to the latest value; button presses are all sent (press + release)
const isBtn = cc => (cc >= 37 && cc <= 52) || (cc >= 85 && cc <= 100)
let outbox = [], flushing = false
const mine = {}   // cc → time of the last own move: SC's echo of an older value must not pull a dragged control back
const send = (cc, v) => {
  S.cc[cc] = v
  mine[cc] = performance.now()
  S.page = pageOfCc(cc)
  const last = outbox[outbox.length - 1]
  if (last && last[0] === cc && !isBtn(cc)) last[1] = v; else outbox.push([cc, v])
  update()
  if (!flushing) { flushing = true; requestAnimationFrame(flush) }
}
const flush = async () => {
  const batch = outbox; outbox = []
  try { await fetch('cc', { method: 'POST', body: JSON.stringify(batch), keepalive: true }) } catch (e) {}
  flushing = false
  if (outbox.length) { flushing = true; requestAnimationFrame(flush) }
}

// ---- the Launchkey row sends as the device would: controls (coalesced per frame) and keys / pads ----
let lkOut = {}, lkFlushing = false
const lkMine = {}
const lkSend = (n, v) => {
  S.lk[n] = v; lkMine[n] = performance.now(); lkOut[n] = v; S.lkLive = performance.now(); update()
  if (!lkFlushing) { lkFlushing = true; requestAnimationFrame(async () => {
    const cc = Object.entries(lkOut).map(([k, x]) => [+k, x]); lkOut = {}
    try { await fetch('lk', { method: 'POST', body: JSON.stringify({ cc }), keepalive: true }) } catch (e) {}
    lkFlushing = false
  }) }
}
const lkNote = (note, chan) => {   // chan 0-based: 9 = drum pads; velocity 100
  fetch('lk', { method: 'POST', body: JSON.stringify({ note: [note, 100, chan] }), keepalive: true }).catch(() => {})
}
const hasLk = () => Object.keys(tags()).some(k => k.startsWith('lk.'))
const LK_KNOBS = [1, 2, 3, 4, 5, 6, 7, 8].map(n => ['k' + n, 20 + n])   // knobs: CC 21-28 (the Launchkey's default)
const BLACK = [1, 3, 6, 8, 10]
// computer keyboard (physical keys, any layout): the A row = white keys from C, the row above = black keys
const KEYMAP = { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7, KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11,
  KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16 }
// pads as on the device: top row 40-43 + 48-51, bottom row 36-39 + 44-47; column i holds top[i] over bottom[i]
const PADS_TOP = [40, 41, 42, 43, 48, 49, 50, 51], PADS_BOTTOM = [36, 37, 38, 39, 44, 45, 46, 47]
const padName = n => S.layout?.lkPads?.[n - 36] ?? 'pad ' + (n - 35)
const lkLight = key => { S.lkLit.set(key, performance.now()); update(); setTimeout(update, 220) }
const lkHtml = () => {
  const tag = key => (tags()['lk.' + key] ?? key).split(' | ')
  const knob = ([key, n]) => { const [name, desc] = tag(key)
    return '<div class="kw r3 ctl" data-lk="' + n + '" title="' + esc(name + (desc ? ': ' + desc : '')) + '">' + knobSvg() + '<span class=kl>' + esc(name) + '</span></div>' }
  const pad = n => '<div class=pad data-pad="' + n + '" title="' + esc(padName(n)) + ' (note ' + n + ')"></div>'
  // a two-octave keyboard from C (the window always starts on a C): 15 white keys, the black keys shorter, between them
  const WHITE = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24], w = 100 / 15
  const keys = WHITE.map((k, i) => '<i class=wht data-wi="' + i + '" data-key="' + k + '" style="left:' + (i * w) + '%"></i>').join('') +
    WHITE.slice(0, -1).flatMap((k, i) => { const b = (k + 1) % 12, shift = { 1: -0.06, 6: -0.06, 3: 0.06, 10: 0.06 }[b] ?? 0
      return BLACK.includes(b) ? ['<i class=blk data-bi="' + (i + 1) + '" data-sh="' + shift + '" data-key="' + (k + 1) + '" style="left:' + ((i + 1) * w - w * 0.29 + w * shift) + '%"></i>'] : [] }).join('')
  const [wheelName, wheelDesc] = tag('level')
  return '<section class=lkbox><p class=lab><span>launchkey</span><span class=pad-name id=lkPad></span>' +
    '<span class=hint>computer keys A–K · octave Z / X</span></p><div class="pn lk" id=lk>' +
    // as on the Launchkey 25: knobs over a tight 2 x 8 pad block, the keys at the bottom with the mod wheel left of them
    '<div class=oct><span class=ol>oct <b id=octv>0</b></span><div class=row><button id=octDown data-oct="-24" title="two octaves down (Z)" aria-label="two octaves down"><svg viewBox="0 0 7 12"><polyline points="6,1 1,6 6,11"/></svg></button><button id=octUp data-oct="24" title="two octaves up (X)" aria-label="two octaves up"><svg viewBox="0 0 7 12"><polyline points="1,1 6,6 1,11"/></svg></button></div></div>' +
    '<div class="gr lkknobs">' + LK_KNOBS.map(knob).join('') + '</div>' +
    '<div class="gr lkpads">' + [...PADS_TOP, ...PADS_BOTTOM].map(pad).join('') + '</div>' +
    '<div class="wheel ctl" data-lk="1" title="' + esc(wheelName + (wheelDesc ? ': ' + wheelDesc : '')) + '">' +
    '<span class=btn>mod</span><div class=fader><div class=bar></div><div class=handle></div></div></div>' +
    '<div class=keys>' + keys + '</div></div></section>'
}
const lkAttach = root => {
  for (const el of root.querySelectorAll('[data-lk]')) {
    const n = +el.dataset.lk
    if (n === 1) {   // the mod wheel: a fader
      const bar = el.querySelector('.fader')
      const at = e => { const r = bar.getBoundingClientRect(), h = r.width * 12 / 28
        return Math.min(1, Math.max(0, (r.bottom - h / 2 - e.clientY) / (r.height - h))) }
      el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); lkSend(n, at(e)) })
      el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) lkSend(n, at(e)) })
    } else {
      let y0 = 0, v0 = 0
      el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); y0 = e.clientY; v0 = S.lk[n] ?? 0 })
      el.addEventListener('pointermove', e => {
        if (!el.hasPointerCapture(e.pointerId)) return
        lkSend(n, Math.min(1, Math.max(0, v0 + (y0 - e.clientY) / (e.shiftKey ? 800 : 200))))
      })
      el.addEventListener('dblclick', () => lkSend(n, 0))
    }
    el.addEventListener('wheel', e => { e.preventDefault(); lkSend(n, Math.min(1, Math.max(0, (S.lk[n] ?? 0) - Math.sign(e.deltaY) * (e.shiftKey ? 0.005 : 0.02)))) }, { passive: false })
  }
  for (const el of root.querySelectorAll('[data-key]')) el.addEventListener('pointerdown', e => { e.preventDefault(); lkNote(S.lkBase + +el.dataset.key, 0) })
  for (const el of root.querySelectorAll('[data-pad]')) el.addEventListener('pointerdown', e => { e.preventDefault(); lkNote(+el.dataset.pad, 9) })
  for (const el of root.querySelectorAll('[data-oct]')) el.addEventListener('click', () => { S.lkBase = Math.min(96, Math.max(24, S.lkBase + +el.dataset.oct)); update() })
}
document.addEventListener('keydown', e => {
  if (!hasLk() || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.code === 'KeyZ' || e.code === 'KeyX') { S.lkBase = Math.min(96, Math.max(24, S.lkBase + (e.code === 'KeyX' ? 24 : -24))); update(); return }
  if (e.code in KEYMAP) { e.preventDefault(); lkNote(S.lkBase + KEYMAP[e.code], 0) }
})

// ---- building the board once per layout (and theme); values are updated in place (a drag keeps its element) ----
const cells = []   // { el, page, n, row, cc, on, name }

  const root = document.getElementById('lc')

  const panels = PAGES.map(page => '<section><p class=lab><span>' + esc(modeLabel(page)) + '</span>' + (page === 'jonas' ? '<span class=hint id=ports></span>' : '') + '</p><div class="pn page" data-page=' + page + '><div class=gr>' +
    cols.map(n => '<div class="cl' + (isGlobal(n) ? ' global' : '') + '"><span class=name>' +

      cell(page, n, 'k1') + cell(page, n, 'k2') + cell(page, n, 'k3') + cell(page, n, 'fader') +
      '<div class=btns>' + cell(page, n, 'b1') + cell(page, n, 'b2') + '</div></div>').join('') + '</div></div></section>').join('')
  root.className = 'board'

    '<div><p class=lab><button class=setlab id=setlab title="set view, how the set went so far: a click shows the next view (also in the player: Settings, key C)"></button></p>' +
    '<div class="spec setbox"><canvas id=setv></canvas></div></div></div><div class=head id=head></div></section></div>'
  document.body.classList.toggle('no-lk', !hasLk())
  lkAttach(root)
  requestAnimationFrame(layoutKeys)
  for (const div of root.querySelectorAll('[data-cell]')) {

    const [name, desc] = (tagOf(page, n, row) ?? '').split(' | ')
    const c = { el: div, page, n, row, cc: ccOf(page, n, row), on: ported(page, n) && !!tagOf(page, n, row), name: name ?? '' }
    div.title = name ? name + (desc ? ': ' + desc : '') : ''
    const kind = row === 'fader' ? 'fader' : row[0] === 'k' ? 'knob' : 'btn'
    div.className = (kind === 'knob' ? 'kw r' + row[1] : kind === 'btn' ? 'btn ' + row : 'fader') + (c.on ? ' ctl' : ' off')
    div.innerHTML = kind === 'fader' ? '<div class=bar></div><div class=handle></div>'
      : kind === 'knob' ? knobSvg() + '<span class=kl>' + esc(name) + '</span>' : esc(name)
    if (c.on) attach(c, kind)
    cells.push(c)
  }
  spectrumResize()
  setDraw()
  update()
}

// ---- interaction ----
const attach = (c, kind) => {
  const el = c.el
  if (kind === 'btn') {
    el.addEventListener('pointerdown', e => {
      e.preventDefault()
      if (e.shiftKey || held.has(c.cc)) {   // Shift-click: keep held; the next click lets go
        if (held.has(c.cc)) { held.delete(c.cc); send(c.cc, 0) } else { held.add(c.cc); send(c.cc, 1) }
        return
      }
      el.setPointerCapture(e.pointerId)
      send(c.cc, 1)
    })
    const up = () => { if (!held.has(c.cc) && S.cc[c.cc] > 0.5) send(c.cc, 0) }
    el.addEventListener('pointerup', up)
    el.addEventListener('pointercancel', up)
    el.addEventListener('lostpointercapture', up)
    return
  }
  if (kind === 'fader') {
    // the handle's centre follows the pointer: 0 = handle at the bottom, 1 = at the top
    const at = e => { const r = el.getBoundingClientRect(), h = r.width * 12 / 28
      return Math.min(1, Math.max(0, (r.bottom - h / 2 - e.clientY) / (r.height - h))) }
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); send(c.cc, at(e)) })
    el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) send(c.cc, at(e)) })
  } else {
    let y0 = 0, v0 = 0
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); y0 = e.clientY; v0 = shownOf(c.cc) })
    el.addEventListener('pointermove', e => {
      if (!el.hasPointerCapture(e.pointerId)) return
      const range = e.shiftKey ? 800 : 200   // pixels for the whole knob travel
      send(c.cc, Math.min(1, Math.max(0, v0 + (y0 - e.clientY) / range)))
    })
    el.addEventListener('dblclick', () => send(c.cc, 0))
  }
  el.addEventListener('wheel', e => { e.preventDefault(); send(c.cc, Math.min(1, Math.max(0, shownOf(c.cc) - Math.sign(e.deltaY) * (e.shiftKey ? 0.005 : 0.02)))) }, { passive: false })
}

// the value a control shows: what the track really uses (a lab column keeps its start values until moved: state.shown),
// except right after an own move (then the dragged value)
const shownOf = cc => (performance.now() - (mine[cc] ?? -1e9) < 300) ? (S.cc[cc] ?? 0) : (S.state?.shown?.[cc] ?? S.cc[cc] ?? 0)

// ---- drawing values (in a requestAnimationFrame, not on every message) ----
let timer = null
const update = () => { timer ??= requestAnimationFrame(() => { timer = null; draw() }) }
const setText = (el, t) => { if (el && el.textContent !== t) el.textContent = t }
const draw = () => {
  if (!S.layout) return
  // frame on the page last moved: only with at most one Launch Control (with two, each board has its own page)
  const lcs = S.midi.filter(p => p[1] === 'lc').length
  for (const p of document.querySelectorAll('.page')) p.classList.toggle('live', lcs < 2 && p.dataset.page === S.page)
  for (const c of cells) {
    if (!c.on) continue
    const v = S.cc[c.cc] ?? 0
    // the track may rename a control (keys with Sound on: the sound mix) or mark a button unused (state.dim)
    const name = S.state?.names?.[c.cc]
    if (c.row === 'b1' || c.row === 'b2') {
      let now, next, on = v > 0.5
      if (isGlobal(c.n)) {
        const g = S.state?.global ?? {}
        ;[now, next] = g[c.row] ?? ['', '']
        if (c.row === 'b2') on = on || !!g.b2on
      } else if (c.row === 'b1') [now, next] = S.state?.rows?.[c.page + ':' + c.n] ?? ['', '']
      else on = on || !!S.state?.on?.[c.cc]
      // button 1 (and Chapter): the active pattern's name, blinking while a switch waits for the bar / phrase (then
      // the coming one); button 2: its function name (or the track's text: Sound on, Lift 40 %), in accent while active
      const waiting = c.row === 'b1' && next !== undefined && next !== '' && next !== now
      const text = c.row === 'b1' ? patName(waiting ? next : now) || name || c.name : (S.state?.labels?.[c.cc] ?? name ?? c.name)
      if (c.row === 'b2') c.el.classList.toggle('on', on || held.has(c.cc))
      else c.el.classList.toggle('dim', !!S.state?.dim?.[c.cc])
      c.el.classList.toggle('blink', waiting)
      setText(c.el, text)
      continue
    }
    const sv = shownOf(c.cc)
    if (c.row === 'fader') c.el.style.setProperty('--v', sv)
    else { setKnob(c.el, sv); setText(c.el.querySelector('.kl'), name ?? c.name) }
  }
  // Launchkey: values, the keyboard window, lit keys / pads, frame while it is the last thing moved
  const lk = document.getElementById('lk')
  if (lk && hasLk()) {
    const now = performance.now(), lit = k => now - (S.lkLit.get(k) ?? -1e9) < 200
    lk.classList.toggle('live', now - S.lkLive < 4000)
    for (const el of lk.querySelectorAll('[data-lk]')) { const v = S.lk[el.dataset.lk] ?? 0; if (el.dataset.lk === '1') el.querySelector('.fader').style.setProperty('--v', v); else setKnob(el, v) }
    for (const el of lk.querySelectorAll('[data-key]')) {
      const m = S.lkBase + +el.dataset.key
      el.className = (BLACK.includes(m % 12) ? 'blk' : 'wht') + (lit('k' + m) ? ' on' : '')
      setText(el, m % 12 === 0 ? 'C' + (m / 12 - 1) : '')
    }
    for (const el of lk.querySelectorAll('[data-pad]')) el.classList.toggle('on', lit('p' + el.dataset.pad))
    const o = (S.lkBase - 48) / 12; setText(document.getElementById('octv'), o > 0 ? '+' + o : String(o))
    const dn = document.getElementById('octDown'), up = document.getElementById('octUp')
    dn.disabled = S.lkBase <= 24; up.disabled = S.lkBase >= 96; dn.classList.toggle('on', o < 0); up.classList.toggle('on', o > 0)
    // the name of the pad hit last, for 2 s, in the label line
    const pad = S.lkPad && now - S.lkPad[1] < 2000 ? S.lkPad[0] : null
    setText(document.getElementById('lkPad'), pad ? '· ' + padName(pad) : '')
    if (pad) setTimeout(update, 2050)
  }
  // status strip: only what shows nowhere else (user, 2026-11-21): a warning when SC or the bridge is missing, the 8 bar
  // marks and 4 beat dots (no 'bar n / 8' text: the marks say it), the chord of the bar. The track's head line
  // (chords / colour) and the global knob values are on the buttons and knobs already.
  const marks = (cls, n, on) => '<span class="marks ' + cls + '">' + [...Array(n).keys()].map(k => '<i' + (k === on ? ' class=on' : '') + '></i>').join('') + '</span>'
  const bt = S.beat
  const beat = !bt ? '' : marks('bars', 8, bt.bar % 8) + marks('beats', 4, bt.beat) +
    (bt.chord ? '<span class=chord>' + esc(bt.chord) + '</span>' : '')
  setText(document.getElementById('ports'), lcs ? lcs + ' Launch Control' + (lcs > 1 ? 's' : '') : 'no Launch Control: mouse only')
  const head = document.getElementById('head')
  head.title = 'drag knobs · click faders · Shift-click holds a button' + (hasLk() ? ' · computer keys A–K, octave Z / X' : '')
  const html =
    (!S.bridge ? '<div class="warn keep">Bridge not reachable</div>' : !S.sc ? '<div class="warn keep">SuperCollider not running</div>' : '') +
    '<div class=row><div class=keep>' + beat + '</div></div>'
  if (head._html !== html) { head._html = html; head.innerHTML = html }   // unchanged: keep the elements (a click in progress)
}

// ---- spectrum: the master output from SC (/ce/spectrum, 48 bands 0..1), drawn on a canvas sized with devicePixelRatio
// Minimal = LED dots (32 x 12), Retro = segments (24 x 12, coloured by range). Peaks fall back 0.6 % of full scale per frame;
// without frames (SC stopped, no data) the bands fall to 0.
const N = 48, FMIN = 20, FMAX = 20000
const fAt = i => FMIN * Math.pow(FMAX / FMIN, (i + .5) / N)
const peaks = new Float32Array(N)
let cv = null, ctx = null
const spectrumResize = () => {
  cv = document.getElementById('spec'); if (!cv) return
  ctx = cv.getContext('2d')
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect()
  cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr))
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
}
addEventListener('resize', spectrumResize)
// keys on whole device pixels: equal gaps (no 2 px / 3 px shimmer), the last key flush with the pad block's right edge
const layoutKeys = () => {
  const box = document.querySelector('.keys'), board = document.querySelector('.board')
  if (!box || !board) return
  const W = box.clientWidth, unit = board.getBoundingClientRect().width / 1600, g = Math.max(1, Math.round(2 * unit)), kw = W / 15
  for (const el of box.querySelectorAll('[data-wi]')) {
    const i = +el.dataset.wi, x0 = Math.round(i * kw), x1 = i === 14 ? W : Math.round((i + 1) * kw) - g
    el.style.left = x0 + 'px'; el.style.width = (x1 - x0) + 'px'
  }
  const bw = Math.round(kw * 0.58)
  for (const el of box.querySelectorAll('[data-bi]')) {
    const x = Math.round(+el.dataset.bi * kw - g / 2 - bw / 2 + kw * +el.dataset.sh)
    el.style.left = x + 'px'; el.style.width = bw + 'px'
  }
}
addEventListener('resize', () => requestAnimationFrame(layoutKeys))
const colors = () => retro()
  ? { dim: light() ? '#B4B2A9' : '#3D3C39', lab: '#888780', low: '#D85A30', mid: '#1D9E75', high: '#378ADD' }
  : light() ? { fg: '#1A1A18', dim: '#DCDAD3', lab: '#8A8984' } : { fg: '#F1EFE8', dim: '#2C2C2A', lab: '#5F5E5A' }
const drawSpectrum = () => {
  if (!cv || !ctx || !cv.isConnected) return
  const r = cv.getBoundingClientRect(), w = r.width, h = r.height, C = colors(), dots = !retro()
  if (!w || !h) return
  if (Math.abs(cv.width - Math.round(w * (window.devicePixelRatio || 1))) > 1) spectrumResize()
  ctx.clearRect(0, 0, w, h)
  // frequency labels under the display, at --fs-lab in 'off'
  const fs = parseFloat(getComputedStyle(document.querySelector('.lab')).fontSize)
  ctx.font = fs + 'px ' + getComputedStyle(document.body).fontFamily; ctx.fillStyle = C.lab; ctx.textBaseline = 'bottom'; ctx.textAlign = 'center'
  for (const [f, s] of [[60, '60'], [250, '250'], [1000, '1k'], [4000, '4k'], [12000, '12k']]) ctx.fillText(s, w * Math.log(f / FMIN) / Math.log(FMAX / FMIN), h)
  const H = h - fs * 1.6
  const fresh = performance.now() - S.specAt < 200
  for (let i = 0; i < N; i++) {
    if (!fresh) S.spec[i] *= 0.9   // no data: fall to 0
    peaks[i] = Math.max(S.spec[i], peaks[i] - 0.006)
  }
  const rows = 12, ncol = dots ? 32 : 24, cw = w / ncol, rh = H / rows
  for (let c = 0; c < ncol; c++) {
    const i0 = Math.floor(c * N / ncol), i1 = Math.floor((c + 1) * N / ncol); let v = 0
    for (let i = i0; i < i1; i++) v = Math.max(v, peaks[i])
    const on = Math.round(v * rows), f = fAt(i0), col = dots ? C.fg : f < 250 ? C.low : f < 4000 ? C.mid : C.high
    for (let rr = 0; rr < rows; rr++) {
      ctx.fillStyle = rr < on ? col : C.dim
      const y = H - (rr + 1) * rh
      ctx.beginPath()
      if (dots) ctx.arc(c * cw + cw / 2, y + rh / 2, Math.min(cw, rh) * .3, 0, Math.PI * 2)
      else ctx.roundRect(c * cw + cw * .12, y + rh * .18, cw * .76, rh * .64, Math.min(cw, rh) * .2)
      ctx.fill()
    }
  }
}
const loop = () => { drawSpectrum(); requestAnimationFrame(loop) }
requestAnimationFrame(loop)

// ---- set view (UI-REDESIGN.md "Set view"): how the set's energy evolved, four views on one canvas (devicePixelRatio).
// Data: one sample every 10 s from SC (sc/lib/ui.scd uiSetFrame) kept by the player's link for the whole session:
// sethistory on connect, then setsample. A sample: t (ms), e (energy dB), p (punch 0..1), x (tension 0..1), s (64 bands).
// The view is a browser setting (the player's "Set view", key C, sends it by postMessage); a click on the label cycles it.
// Default: the ring, labelled 'energy' (it shows the set's energy); the other labels after SET_LABELS (user, 2026-11-20).
// 2026-11-21 (user): candidates for reading short times (sc/ui/reference/set-view-options.html), from SC's fast samples
// (/ce/setfast, every second: energy dB + 12 band groups): ring10 (the hour in 10 s wedges), minute (last minute, 2 s
// per column, dots), line2 (last 2 min at 1 s), two / two-line (the minute over the hour), spectro (last minute, 12 band
// rows, dots) and spectro-line (same, continuous). All views share one scale: 5-95 % of the set's 1 s values so far.
const SET_KEY = 'ce.setView', SET_VIEWS = ['ring', 'ring10', 'minute', 'line2', 'two', 'two-line', 'spectro', 'spectro-line', 'map', 'energy', 'spectrogram'], SET_STEP = 10 / 60   // minutes per sample
const readSetView = () => { try { const v = localStorage.getItem(SET_KEY); return SET_VIEWS.includes(v) ? v : 'ring' } catch (e) { return 'ring' } }
const SET_LABELS = { ring: 'energy', ring10: 'energy · 10 s', minute: 'last minute', line2: 'last 2 min', two: 'minute · hour',
  'two-line': 'minute · hour · line', spectro: 'bands · minute', 'spectro-line': 'bands · minute · line', energy: 'energy · area', map: 'map', spectrogram: 'spectrogram' }
let setView = readSetView()
S.setHist = []; S.setFast = []
const applySetView = v => { if (SET_VIEWS.includes(v) && v !== setView) { setView = v; setDraw() } }
const cycleSetView = () => {
  const v = SET_VIEWS[(SET_VIEWS.indexOf(setView) + 1) % SET_VIEWS.length]
  try { localStorage.setItem(SET_KEY, v) } catch (e) {}
  applySetView(v)
  if (parent !== window) parent.postMessage({ setView: v }, location.origin)   // the player keeps its setting in step
}
addEventListener('message', e => { if (e.origin === location.origin && SET_VIEWS.includes(e.data?.setView)) applySetView(e.data.setView) })
addEventListener('storage', e => { if (e.key === SET_KEY) applySetView(readSetView()) })
document.addEventListener('click', e => { if (e.target.closest?.('#setlab')) cycleSetView() })
addEventListener('resize', () => setDraw())

// one scale for every view (user, 2026-11-21): bottom / top = the 5 % / 95 % values of the set's loudness so far (1 s
// samples, or the 10 s ones before any arrived), at least 12 dB apart; silence (the -70 dB floor) is 0. No square root.
const setScale = () => {
  const v = (S.setFast.length ? S.setFast : S.setHist).map(s => s.e).filter(e => e > -69).sort((a, b) => a - b)
  if (!v.length) return e => 0
  const hi = v[Math.min(v.length - 1, Math.floor(v.length * .95))], lo = Math.min(v[Math.floor(v.length * .05)], hi - 12)
  return e => e > -69 ? Math.min(1, Math.max(0, (e - lo) / (hi - lo))) : 0
}
// samples → minutes since the set began (the first sample ends its first 10 s), energy on the scale above
const setData = () => {
  const H = S.setHist
  if (!H.length) return { D: [], NOW: 0 }
  const t0 = H[0].t - 10000, N = setScale()
  const D = H.map(s => ({ m: (s.t - t0) / 60000, e: N(s.e), t: s.x, d: s.p, s: s.s }))
  return { D, NOW: D[D.length - 1].m }
}
// the last n buckets of `step` seconds from the fast samples, newest last (null = nothing yet): { e (0..1), g (12 bands) }
const fastBuckets = (step, n) => {
  const F = S.setFast, out = Array(n).fill(null)
  if (!F.length) return out
  const N = setScale(), tEnd = F[F.length - 1].t, acc = Array.from({ length: n }, () => ({ p: 0, k: 0, g: Array(12).fill(0) }))
  for (let i = F.length - 1; i >= 0; i--) {
    const b = n - 1 - Math.floor((tEnd - F[i].t) / 1000 / step); if (b < 0) break
    const a = acc[b]; a.p += 10 ** (F[i].e / 10); a.k++; F[i].g.forEach((v, j) => a.g[j] += v)
  }
  return acc.map(a => a.k ? { e: N(a.p > 0 ? 10 * Math.log10(a.p / a.k) : -70), g: a.g.map(v => v / a.k) } : null)
}
const smooth = (arr, k) => arr.map((_, i) => { let sum = 0, n = 0; for (let j = Math.max(0, i - k); j <= Math.min(arr.length - 1, i + k); j++) { sum += arr[j]; n++ } return sum / n })
// runs of samples without a gap of more than 30 s (a stop): paths break there
const runs = D => { const out = []; let cur = []
  D.forEach((s, i) => { if (i && s.m - D[i - 1].m > 0.5) { out.push(cur); cur = [] } cur.push(i) }); if (cur.length) out.push(cur); return out }

const setColors = () => retro() && !light()
  ? { now: '#D85A30', data: '#F1EFE8', flat: '#378ADD', lab: '#888780', grid: '#3D3C39', bg: '#232321', bgRgb: [35, 35, 33], ink: [241, 239, 232],
      cur: '#F1EFE8', old: '#888780', off: '#3D3C39' }
  : !retro() && light()
  ? { now: '#1A1A18', data: '#6E6D68', flat: '#1A1A18', lab: '#8A8984', grid: '#DCDAD3', bg: '#F4F3EE', bgRgb: [244, 243, 238], ink: [26, 26, 24],
      cur: '#5F5E5A', old: '#B4B2A9', off: '#DCDAD3' }
  : retro()
  ? { now: '#D85A30', data: '#2C2C2A', flat: '#378ADD', lab: '#888780', grid: '#B4B2A9', bg: '#D3D1C7', bgRgb: [211, 209, 199], ink: [44, 44, 42],
      cur: '#2C2C2A', old: '#5F5E5A', off: '#B4B2A9' }
  : { now: '#F1EFE8', data: '#888780', flat: '#F1EFE8', lab: '#5F5E5A', grid: '#2C2C2A', bg: '#0b0b0b', bgRgb: [11, 11, 11], ink: [241, 239, 232],
      cur: '#B4B2A9', old: '#5F5E5A', off: '#2C2C2A' }

const setDraw = () => {
  const cv = document.getElementById('setv'), lab = document.getElementById('setlab')
  if (lab) setText(lab, SET_LABELS[setView])
  if (!cv || !cv.isConnected) return
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect(), w = r.width, h = r.height
  if (!w || !h) return
  cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr))
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h)
  const K = setColors(), u = document.querySelector('.board').getBoundingClientRect().width / 1600
  // a colour between two hex colours (t = 0: a, 1: b)
  const mix = (a, b, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), x = p(a), y = p(b)
    return 'rgb(' + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',') + ')' }
  const fs = parseFloat(getComputedStyle(document.querySelector('.lab')).fontSize), F = getComputedStyle(document.body).fontFamily
  c.font = fs + 'px ' + F; c.lineJoin = 'round'
  // a label on top of data gets a halo in the background colour
  const label = (text, x, y, color) => { c.lineWidth = 3 * u + 2; c.strokeStyle = K.bg; c.strokeText(text, x, y); c.fillStyle = color; c.fillText(text, x, y) }
  const { D, NOW } = setData()
  // the fine views: a dot grid like the spectrum's (Minimal dots 32 columns, Retro segments 24), or continuous lines
  const cols = retro() ? 24 : 32, foot = fs * 1.6 + 4 * u, GH = h - foot
  const cell = (cx, cy, cw, rh) => { c.beginPath(); if (retro()) c.roundRect(cx - cw * .38, cy - rh * .3, cw * .76, rh * .6, rh * .2); else c.arc(cx, cy, Math.min(cw, rh) * .3, 0, Math.PI * 2); c.fill() }
  const dots = (y0, H, rows, vals, color) => { const cw = w / cols, rh = H / rows
    vals.forEach((v, i) => { const on = v == null ? 0 : Math.max(v > 0 ? 1 : 0, Math.round(v * rows))
      for (let r = 0; r < rows; r++) { c.fillStyle = r < on ? color(i) : K.off; cell((i + .5) * cw, y0 + H - (r + .5) * rh, cw, rh) } }) }
  const line = (x0, y0, W, H, vals) => {   // vals 0..1 or null, evenly over W; area + line + now dot
    const first = vals.findIndex(v => v != null); if (first < 0 || vals.length - first < 2) return
    const n = vals.length - 1, X = i => x0 + i / n * W, Y = v => y0 + H - (v ?? 0) * H
    c.beginPath(); c.moveTo(X(first), y0 + H); for (let i = first; i <= n; i++) c.lineTo(X(i), Y(vals[i])); c.lineTo(X(n), y0 + H)
    c.fillStyle = mix(K.bg, K.data, .3); c.fill()
    c.beginPath(); for (let i = first; i <= n; i++) i === first ? c.moveTo(X(i), Y(vals[i])) : c.lineTo(X(i), Y(vals[i]))
    c.strokeStyle = K.data; c.lineWidth = 1.5 * u + .5; c.stroke()
    c.fillStyle = K.now; c.beginPath(); c.arc(X(n), Y(vals[n]), 3.5 * u + 1, 0, Math.PI * 2); c.fill() }
  const foots = (left, right) => { c.textBaseline = 'bottom'; c.fillStyle = K.lab; c.textAlign = 'left'; c.fillText(left, 0, h)
    c.fillStyle = K.now; c.textAlign = 'right'; c.fillText(right, w, h) }
  const hourCols = () => { const step = 60 / cols, out = Array(cols).fill(null)   // the last 60′ in columns of 60/cols minutes, 10 s data
    for (const s of D) { const k = cols - 1 - Math.floor((NOW - s.m) / step); if (k >= 0) out[k] = out[k] == null ? [s.e, 1] : [out[k][0] + s.e, out[k][1] + 1] }
    return out.map(v => v && v[0] / v[1]) }
  if (setView === 'minute') {
    dots(0, GH, 12, fastBuckets(2, cols).map(b => b?.e ?? null), i => i === cols - 1 ? K.now : K.cur); foots('−' + cols * 2 + ' s', 'now')
  } else if (setView === 'line2') {
    c.fillStyle = K.grid; for (const q of [0, 30, 60, 90]) c.fillRect(q / 120 * w, 0, 1, GH)
    line(0, 2 * u, w, GH - 2 * u, fastBuckets(1, 120).map(b => b?.e ?? null)); foots('−2′', 'now')
  } else if (setView === 'two') {
    const Ht = GH * .62, Hb = GH * .3
    dots(0, Ht, 8, fastBuckets(2, cols).map(b => b?.e ?? null), i => i === cols - 1 ? K.now : K.cur)
    dots(GH - Hb, Hb, 4, hourCols(), i => i === cols - 1 ? K.now : K.old); foots('−' + cols * 2 + ' s · 60′', 'now')
  } else if (setView === 'two-line') {
    const Ht = GH * .6, Hb = GH * .3
    line(0, 2 * u, w, Ht - 2 * u, fastBuckets(1, 120).map(b => b?.e ?? null))
    c.fillStyle = K.grid; c.fillRect(0, GH, w, 1)
    const hr = D.filter(s => s.m > NOW - 60)
    if (hr.length > 1) { const x0 = Math.max(0, (hr[0].m - (NOW - 60)) / 60) * w; line(x0, GH - Hb, w - x0, Hb, hr.map(s => s.e)) }
    foots('−2′ · 60′', 'now')
  } else if (setView === 'spectro' || setView === 'spectro-line') {
    // 12 band groups (low at the bottom) over the last minute, brightness = level; scaled to the loudest cell shown
    const n = setView === 'spectro' ? cols : 60, B = fastBuckets(setView === 'spectro' ? 2 : 1, n)
    const all = B.flatMap(b => b ? b.g : []), hi = Math.max(.01, ...all), lo = Math.max(0, hi - .45), lv = v => Math.min(1, Math.max(0, (v - lo) / (hi - lo)))
    const cw = w / n, rh = GH / 12
    B.forEach((b, i) => { if (!b) return; for (let r = 0; r < 12; r++) {
      c.fillStyle = mix(K.off, i === n - 1 ? K.now : K.cur, lv(b.g[r]))
      if (setView === 'spectro') cell((i + .5) * cw, GH - (r + .5) * rh, cw, rh)
      else c.fillRect(i * cw, GH - (r + 1) * rh, cw + .6, rh + .6) } })
    foots('−' + (setView === 'spectro' ? cols * 2 : 60) + ' s', 'now')
  } else if (setView === 'ring10') {
    // the hour as 360 wedges of 10 s, length = energy (linear), brightness by age; the second hour paints over the first
    const cx = w / 2, cy = h / 2, R1 = Math.min(w, h) / 2 - 2, R0 = R1 * .4
    c.beginPath(); c.arc(cx, cy, R1, 0, Math.PI * 2); c.arc(cx, cy, R0, 0, Math.PI * 2, true); c.fillStyle = K.off; c.fill('evenodd')
    const cur = D.length - 1, lap = Math.floor(cur / 360) * 360
    for (let k = 0; k < 360; k++) {
      const idx = k <= cur - lap ? lap + k : lap - 360 + k, s = D[idx]; if (!s) continue
      const a0 = (-90 + k) * Math.PI / 180, a1 = a0 + Math.PI / 180 * 1.02, r = R0 + (R1 - R0) * s.e
      c.beginPath(); c.arc(cx, cy, r, a0, a1); c.arc(cx, cy, R0, a1, a0, true); c.closePath()
      c.fillStyle = idx === cur ? K.now : mix(K.cur, K.old, Math.min(1, (cur - idx) / 359)); c.fill() }
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = (fs * 1.5) + 'px ' + F; c.fillStyle = K.now
    c.fillText(Math.floor(NOW) + '′', cx, cy)
  } else if (setView === 'ring') {
    // fixed 60′ clock in the spectrum's grid language: 60 spokes (one per minute) x 8 cells, lit = round(√energy · 8);
    // cells grow with the radius; the second hour paints over the first. Brightness follows each minute's AGE, from
    // the newest (cur) to 60' old (old), so the only edge is at the needle (newest next to oldest), none at 12 o'clock
    const cx = w / 2, cy = h / 2, R1 = Math.min(w, h) / 2 - 2, R0 = R1 * .4, RINGS = 8, st = (R1 - R0) / RINGS
    const sums = new Map()
    for (const s of D) { const k = Math.floor(s.m - SET_STEP / 2), a = sums.get(k) ?? [0, 0]; a[0] += s.e; a[1]++; sums.set(k, a) }
    const nowMin = D.length ? Math.floor(NOW - SET_STEP / 2) : -1, lap = Math.floor(nowMin / 60) * 60
    for (let k = 0; k < 60; k++) {
      const a = (-90 + (k + .5) * 6) * Math.PI / 180, mAbs = k <= nowMin - lap ? lap + k : lap - 60 + k
      const lit = mix(K.cur, K.old, Math.min(1, Math.max(0, (nowMin - mAbs) / 59)))
      const sm = sums.get(mAbs), on = sm ? Math.round(sm[0] / sm[1] * RINGS) : 0, isNow = D.length > 0 && mAbs === nowMin
      for (let rr = 0; rr < RINGS; rr++) {
        const rad = R0 + (rr + .5) * st, x = cx + rad * Math.cos(a), y = cy + rad * Math.sin(a), slot = rad * Math.PI / 30
        c.fillStyle = rr < on ? (isNow ? K.now : lit) : K.off
        c.beginPath()
        if (retro()) { const tw = slot * .85 / 2; c.save(); c.translate(x, y); c.rotate(a); c.roundRect(-st * .34, -tw / 2, st * .68, tw, Math.min(tw, st * .68) * .3); c.restore() }
        else c.arc(x, y, Math.min(st * .32, slot / 2 * .55), 0, Math.PI * 2)
        c.fill()
      }
    }
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = (fs * 1.5) + 'px ' + F; c.fillStyle = K.now
    c.fillText(Math.floor(NOW) + '′', cx, cy)
  } else if (setView === 'map') {
    // mood map, x = energy, y = tension; no window: the trail fades with age (alpha = e^(−age/12′), gone below 0.05)
    // labels outside the square (user, 2026-11-21): above it tense / full, under it calm / driving
    const lh = fs * 1.35, side = Math.min(w, h - 2 * lh), x0 = (w - side) / 2, y0 = (h - side) / 2, X = e => x0 + e * side, Y = t => y0 + side - t * side
    c.strokeStyle = K.grid; c.lineWidth = 1; c.strokeRect(x0 + .5, y0 + .5, side - 1, side - 1)
    c.fillStyle = K.grid; c.fillRect(x0 + side / 2, y0, 1, side); c.fillRect(x0, y0 + side / 2, side, 1)
    if (D.length) {
      const Ex = smooth(D.map(s => s.e), 12), Tx = smooth(D.map(s => s.t), 12), n = D.length - 1, TAU = 12, B = 3
      for (let b = 0; ; b++) {   // age buckets of 3′, each drawn as a few continuous paths
        const a0 = b * B, alpha = Math.exp(-(a0 + B / 2) / TAU); if (alpha < .05) break
        c.globalAlpha = alpha; c.strokeStyle = K.data; c.lineWidth = (1 + 2 * alpha) * u; c.beginPath()
        for (const run of runs(D)) { let open = false
          for (const i of run) { const age = NOW - D[i].m; if (age < a0 || age > a0 + B + SET_STEP) { open = false; continue }
            open ? c.lineTo(X(Ex[i]), Y(Tx[i])) : c.moveTo(X(Ex[i]), Y(Tx[i])); open = true } }
        c.stroke()
      }
      c.globalAlpha = 1; c.strokeStyle = K.now; c.lineWidth = 3 * u; c.lineCap = 'round'; c.beginPath()
      for (let i = Math.max(0, n - 9); i <= n; i++) i === Math.max(0, n - 9) ? c.moveTo(X(Ex[i]), Y(Tx[i])) : c.lineTo(X(Ex[i]), Y(Tx[i]))
      c.stroke(); c.lineCap = 'butt'
      c.fillStyle = K.now; c.beginPath(); c.arc(X(Ex[n]), Y(Tx[n]), 6 * u, 0, Math.PI * 2); c.fill()
    }
    c.fillStyle = K.lab; c.textBaseline = 'bottom'; c.textAlign = 'left'; c.fillText('tense', x0, y0 - 2 * u); c.textAlign = 'right'; c.fillText('full', x0 + side, y0 - 2 * u)
    c.textBaseline = 'top'; c.fillText('driving', x0 + side, y0 + side + 2 * u); c.textAlign = 'left'; c.fillText('calm', x0, y0 + side + 2 * u)
  } else {
    // strips: the last 60′, now at the right edge
    const L = setView === 'spectrogram' ? fs * 2.2 : 0, top = 4 * u, H = h - fs * 1.6 - 6 * u, t0 = NOW - 60, X = m => L + (m - t0) / 60 * (w - L)
    const vis = D.map((s, i) => i).filter(i => D[i].m >= t0 - SET_STEP)
    if (setView === 'energy' && vis.length) {
      const E = smooth(D.map(s => s.e), 1), P = smooth(D.map(s => s.d), 1), Yv = i => top + H - E[i] * H
      const groups = runs(D).map(run => run.filter(i => vis.includes(i))).filter(g => g.length)
      const area = () => { c.beginPath(); for (const g of groups) { c.moveTo(X(D[g[0]].m - SET_STEP), top + H); g.forEach(i => c.lineTo(X(D[i].m), Yv(i))); c.lineTo(X(D[g[g.length - 1]].m), top + H); c.closePath() } }
      c.fillStyle = K.data; area(); c.fill()
      // a band along the top edge where punch < 0.35 ("it got flat"), clipped to the area
      c.save(); area(); c.clip(); c.strokeStyle = K.flat; c.lineWidth = 8 * u; c.beginPath()
      for (const g of groups) { let open = false
        for (const i of g) { if (P[i] < .35) { open ? c.lineTo(X(D[i].m), Yv(i)) : c.moveTo(X(D[i].m) - (g.length > 1 ? 0 : 2), Yv(i)); open = true } else open = false } }
      c.stroke(); c.restore()
    } else if (setView === 'spectrogram') {
      // 64 log-frequency rows (bottom 20 Hz → top 20 kHz), 360 columns of 10 s; intensity = ink alpha, each row scaled to
      // its own maximum, curve ^1.4, ±3 samples (~30 s) soft smoothing; no sample = background
      const ROWS = 64, COLS = 360, img = new ImageData(COLS, ROWS)
      const cols = vis.map(i => Math.floor((D[i].m - t0) / SET_STEP - .5)).map(k => Math.min(COLS - 1, k))
      for (let rr = 0; rr < ROWS; rr++) {
        const row = smooth(vis.map(i => D[i].s?.[rr] ?? 0), 3), mx = Math.max(0, ...row) || 1
        row.forEach((v, j) => { const k = cols[j]; if (k < 0) return
          const a = .85 * Math.min(1, v / mx) ** 1.4, p = ((ROWS - 1 - rr) * COLS + k) * 4
          for (let q = 0; q < 3; q++) img.data[p + q] = K.bgRgb[q] + (K.ink[q] - K.bgRgb[q]) * a
          img.data[p + 3] = 255 })
      }
      const off = document.createElement('canvas'); off.width = COLS; off.height = ROWS; off.getContext('2d').putImageData(img, 0, 0)
      c.imageSmoothingEnabled = true; c.drawImage(off, L, top, w - L, H)
    }
    if (setView === 'spectrogram') {
      c.fillStyle = K.lab; c.textAlign = 'right'; c.textBaseline = 'middle'
      for (const [fq, l] of [[100, '100'], [1000, '1k'], [10000, '10k']]) c.fillText(l, L - 6 * u, top + H - Math.log(fq / 20) / Math.log(1000) * H)
    }
    c.fillStyle = K.lab; c.textBaseline = 'top'; c.textAlign = 'left'; c.fillText('−60′', L, top + H + 6 * u)
    c.textAlign = 'center'; c.fillText('−30′', X(NOW - 30), top + H + 6 * u)
    c.fillStyle = K.now; c.textAlign = 'right'; c.fillText('now', w, top + H + 6 * u)
    c.fillRect(w - 2.5 * u, top, 2.5 * u, H)
  }
  c.textAlign = 'left'; c.globalAlpha = 1
}

// ---- live state from the bridge ----
const connect = () => {
  const es = new EventSource('events')
  es.onopen = () => { S.bridge = true; update() }
  es.onerror = () => { S.bridge = false; update() }
  es.onmessage = e => {
    const { type, data } = JSON.parse(e.data)
    if (type === 'spectrum') { if (Array.isArray(data)) { S.spec.set(data.slice(0, N)); S.specAt = performance.now() } return }
    if (type === 'sethistory') { if (Array.isArray(data)) { S.setHist = data; setDraw() } return }
    if (type === 'setsample') { if (data && typeof data.t === 'number') { S.setHist.push(data); setDraw() } return }
    if (type === 'setfasthistory') { if (Array.isArray(data)) { S.setFast = data; setDraw() } return }
    if (type === 'setfast') { if (data && typeof data.t === 'number') { S.setFast.push(data); if (S.setFast.length > 3 * 3600) S.setFast.shift(); setDraw() } return }
    if (type === 'layout') { const first = !S.layout || JSON.stringify(S.layout) !== JSON.stringify(data); S.layout = data; document.title = data.name + ' · LC XL 3'; if (first) build() }
    else if (type === 'ccs') { data.forEach((v, i) => { if (!(performance.now() - (mine[i] ?? -1e9) < 300)) S.cc[i] = v }) }
    else if (type === 'cc') {
      for (const [cc, v] of Object.entries(data)) if (!(performance.now() - (mine[cc] ?? -1e9) < 300)) { S.cc[+cc] = v; S.page = pageOfCc(+cc) }
    }
    else if (type === 'state') S.state = data
    else if (type === 'beat') S.beat = data
    else if (type === 'midi') S.midi = data
    else if (type === 'sc') S.sc = data
    else if (type === 'lk') { for (const [k, v] of Object.entries(data)) if (!(performance.now() - (lkMine[k] ?? -1e9) < 300)) S.lk[k] = v }
    else if (type === 'lkcc') { const [k, v] = data; if (!(performance.now() - (lkMine[k] ?? -1e9) < 300)) { S.lk[k] = v; S.lkLive = performance.now() } }
    else if (type === 'lknote') {   // a key or pad played (device or UI): light it; a key outside the window moves it
      const [note, chan] = data
      if (chan === 9) { lkLight('p' + note); S.lkPad = [note, performance.now()] }
      else { if (note < S.lkBase || note > S.lkBase + 24) S.lkBase = 12 * Math.floor(note / 12); lkLight('k' + note) }
      S.lkLive = performance.now()
    }
    update()
  }
}
applyTheme(readTheme())
connect()
</script>
