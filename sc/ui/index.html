<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>LC XL 3</title>
<style>
/* Two themes from UI-REDESIGN.md: "black" (Torso-like, default) and "te" (Teenage Engineering-like). Only tokens and
   the knob component differ; the layout is the same. Flat: no gradients, shadows or glow. */
body:not([data-theme=te]) .cell span,body:not([data-theme=te]) .col{letter-spacing:-.04em}
body,body[data-theme=black]{--bg:#0b0b0b;--text:#F1EFE8;--off:#5F5E5A;--track:#2C2C2A;--accent:#F1EFE8;--handle:#F1EFE8;--frame:#F1EFE8;
  --font:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body[data-theme=te]{--bg:#D3D1C7;--text:#2C2C2A;--off:#888780;--track:#B4B2A9;--accent:#D85A30;--handle:#D85A30;--frame:#2C2C2A;
  --font:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.25 var(--font);user-select:none;-webkit-user-select:none}
#lc{display:flex;flex-direction:column;gap:8px;padding:10px 10px;box-sizing:border-box;height:100%;overflow:hidden}
.pages{flex:1;display:flex;gap:8px;min-height:0}
.page{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;min-height:0;padding:6px 4px;border:1px solid transparent}
.page.live,.lk.live{border-color:var(--frame)}
.page h2,.lk h2{margin:0;font-size:11px;font-weight:400;color:var(--off);white-space:nowrap;overflow:hidden}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));
  grid-template-rows:20px repeat(3,48px) minmax(60px,1fr) 18px 18px;column-gap:2px;row-gap:6px}
.g{border-left:1px solid var(--track)}
.col{font-size:13px;font-weight:500;text-align:center;white-space:nowrap;overflow:hidden;align-self:end}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:0}
.cell span{font-size:11px;white-space:nowrap;overflow:hidden;max-width:100%}
.cell.off{visibility:hidden}
/* knob: an SVG with both components; the theme shows one */
.knob svg{width:26px;height:26px;flex:none;overflow:visible}
.kb-track,.kb-val{fill:none;stroke-width:3;stroke-linecap:round}.kb-track{stroke:var(--track)}.kb-val{stroke:var(--text)}
.kb-ptr{stroke-width:2.5;stroke-linecap:round}
body[data-theme=te] .kb-arc{display:none}body:not([data-theme=te]) .kb-disc{display:none}
.r1 .kb-disc circle{fill:#378ADD;stroke:#378ADD}.r2 .kb-disc circle{fill:#1D9E75;stroke:#1D9E75}
.r3 .kb-disc circle{fill:#F1EFE8;stroke:#888780}.kb-disc circle{stroke-width:1}
.r1 .kb-ptr,.r2 .kb-ptr{stroke:#F1EFE8}.r3 .kb-ptr{stroke:#2C2C2A}
/* fader: 2 px track, 14 x 6 px handle */
.bar{position:relative;width:14px;flex:1;min-height:30px}
.bar::before{content:'';position:absolute;left:6px;width:2px;top:0;bottom:0;background:var(--track)}
.bar i{position:absolute;left:0;width:14px;height:6px;border-radius:1px;background:var(--handle);bottom:calc(var(--v,0) * (100% - 6px))}
/* buttons: text only; only the button text dims (UI-REDESIGN.md "States") */
.btn{font-size:11px;justify-content:center}.btn span{font-size:11px}
.b1 span{color:var(--text)}.b1.off-col span{color:var(--off)}
.b2 span{color:var(--off)}.b2.on span{color:var(--accent)}
.blink span{animation:blink 1s steps(1,end) infinite}@keyframes blink{0%{opacity:1}50%{opacity:.25}}
/* status strip (bottom) */
.head{flex:none;display:flex;gap:18px;align-items:baseline;white-space:nowrap;overflow:hidden;font-size:11px}
.head>div{min-width:0;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}.head>div.ports{flex-shrink:2}.head>div.help{flex-shrink:20}.head .k{color:var(--off);margin-right:.5em}
.warn{color:var(--accent);font-weight:600}.ports,.help{color:var(--off)}.help{flex-shrink:3;margin-left:auto}
.beats i,.bars i{display:inline-block;background:var(--track);margin-left:3px;vertical-align:middle}
.beats i{width:7px;height:7px;border-radius:50%}.bars i{width:10px;height:4px}.beats i.on,.bars i.on{background:var(--text)}
.beats,.bars,.chord{margin-left:6px}.next{color:var(--off)}
.theme{font:inherit;font-size:11px;background:none;border:0;color:var(--off);cursor:pointer;padding:0}.theme b{color:var(--text);font-weight:500}
/* Launchkey row */
.lk{flex:none;display:flex;flex-direction:column;gap:6px;padding:6px 4px;border:1px solid transparent}
.lkbody{display:flex;gap:10px}.lkmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.lkrow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;height:48px}.lkbody>.fader{flex:none;width:72px;justify-content:flex-start}
.lkplay{display:flex;gap:16px;height:64px}.lkoct{display:flex;flex-direction:column;justify-content:center;gap:6px}
.lkoct button{font:inherit;font-size:11px;background:none;border:0;color:var(--text);cursor:pointer;padding:0;white-space:nowrap}
.lkkeys{flex:2;display:grid;grid-template-columns:repeat(25,1fr);gap:2px;min-width:0}
.lkkeys i{border:1px solid var(--track);font-style:normal;font-size:11px;display:flex;align-items:flex-end;justify-content:center;color:var(--off);cursor:pointer;overflow:hidden}
.lkkeys i.blk{background:var(--track)}.lkkeys i.on{background:var(--text);color:var(--bg)}
.lkpads{flex:3;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:1fr 1fr;gap:2px 6px;min-width:0}
.lkpads i{font-style:normal;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.lkpads i::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--track);flex:none}
.lkpads i.on::before{background:var(--text)}
.lkpads i span{font-size:11px;color:var(--off);white-space:nowrap;overflow:hidden;max-width:100%}
.lk .knob svg{width:26px;height:26px}
/* interactive */
.ctl{cursor:ns-resize;touch-action:none}.btn.ctl{cursor:pointer}
@media (max-width:900px){#lc{height:auto;overflow:visible}.pages{flex-direction:column}.page{min-height:80vh}.help{display:none}}
</style>
</head>
<body>
<div id=lc><div class=head><span class=warn>Waiting for the bridge …</span></div></div>
<script>
// LC view for the SuperCollider version, interactive: drag knobs (up/down; Shift = fine; double-click = 0), click or
// drag faders, press buttons (Shift-click = keep the button held until the next click). Same look as the ▣ LC big
// view of the Strudel tracks. Values come from SuperCollider (also every move on a Launch Control); a click sends the
// same CC a Launch Control would send, so for the track it makes no difference where a move comes from.
// ---- theme (UI-REDESIGN.md): 'black' (default) or 'te'; one browser setting shared with the player's Panel theme ----
const THEME_KEY = 'ce.panelTheme', THEMES = ['black', 'te']
const readTheme = () => { try { return THEMES.includes(localStorage.getItem(THEME_KEY)) ? localStorage.getItem(THEME_KEY) : 'black' } catch (e) { return 'black' } }
const applyTheme = t => { document.body.dataset.theme = t; const b = document.getElementById('theme'); if (b) b.innerHTML = themeLabel() }
const setTheme = t => { try { localStorage.setItem(THEME_KEY, t) } catch (e) {} applyTheme(t) }
const themeLabel = () => THEMES.map(t => t === document.body.dataset.theme ? '<b>' + (t === 'te' ? 'TE' : 'Black') + '</b>' : (t === 'te' ? 'TE' : 'Black')).join(' / ')
addEventListener('storage', e => { if (e.key === THEME_KEY) applyTheme(readTheme()) })
addEventListener('message', e => { if (e.origin === location.origin && THEMES.includes(e.data?.panelTheme)) applyTheme(e.data.panelTheme) })
applyTheme(readTheme())

// ---- knob: one SVG with both components (arc for Black, disc with pointer for TE); the theme shows one ----
const polar = (r, deg) => { const a = deg * Math.PI / 180; return [13 + r * Math.cos(a), 13 + r * Math.sin(a)] }
const arc = (r, a0, a1) => { const [x0, y0] = polar(r, a0), [x1, y1] = polar(r, a1)
  return 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + 'A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) }
const knobSvg = () => '<svg viewBox="0 0 26 26" aria-hidden="true"><g class=kb-arc><path class=kb-track d="' + arc(9, 135, 405) + '"/><path class=kb-val d=""/></g>' +
  '<g class=kb-disc><circle cx=13 cy=13 r=12 /><line class=kb-ptr x1=13 y1=13 x2=13 y2=13 /></g></svg>'
const setKnob = (el, v) => {
  v = Math.min(1, Math.max(0, +v || 0))
  const a = 135 + 270 * v, val = el.querySelector('.kb-val'), ptr = el.querySelector('.kb-ptr')
  if (val) val.setAttribute('d', v > 0.001 ? arc(9, 135, a) : '')
  if (ptr) { const [x1, y1] = polar(4, a), [x2, y2] = polar(10, a); ptr.setAttribute('x1', x1); ptr.setAttribute('y1', y1); ptr.setAttribute('x2', x2); ptr.setAttribute('y2', y2) }
}

const ROWS = ['k1', 'k2', 'k3', 'fader', 'b1', 'b2']
const CC_ROW = { k1: 12, k2: 20, k3: 28, fader: 4, b1: 36, b2: 44 }   // CC = row base + column (Mode 1)
const PAGES = ['jojo', 'jonas'], PREFIX = { jojo: '16', jonas: '2' }
const S = { layout: null, cc: Array(128).fill(0), state: null, beat: null, midi: [], sc: false, page: 'jojo', bridge: false,
  lk: {}, lkBase: 48, lkLit: new Map(), lkLive: 0 }   // Launchkey: control values, keyboard window, lit keys/pads
const held = new Set()   // CCs kept held by Shift-click
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const tags = () => S.layout?.tags ?? {}
const isGlobal = n => n === 8
// CC of a control: Jojo plain, Jonas + 48 (column 8: plain on both pages, SC maps the Mode 2 CCs onto them)
const ccOf = (page, n, row) => CC_ROW[row] + n + (page === 'jonas' && n < 8 ? 48 : 0)
const tagOf = (page, n, row) => tags()[isGlobal(n) ? 'g.' + row : PREFIX[page] + ':' + n + '.' + row]
const ported = (page, n) => isGlobal(n) || ROWS.some(r => tagOf(page, n, r))
const pageOfCc = cc => cc > 52 ? 'jonas' : (cc - 4) % 8 === 0 ? S.page : 'jojo'
const shortTitle = t => {
  const m = (t ?? '').match(/^(.*?) — .*?\((.+?)\)/)
  if (!m) return (t ?? '').split(' · ')[0]
  return m[1] + ' — ' + m[2][0].toUpperCase() + m[2].slice(1)
}

// ---- sending: coalesced per frame, one POST per batch ----
// knob/fader moves of one control collapse to the latest value; button presses are all sent (press + release)
const isBtn = cc => (cc >= 37 && cc <= 52) || (cc >= 85 && cc <= 100)
let outbox = [], flushing = false
const mine = {}   // cc → time of the last own move: SC's echo of an older value must not pull a dragged control back
const send = (cc, v) => {
  S.cc[cc] = v
  mine[cc] = performance.now()
  S.page = pageOfCc(cc)
  const last = outbox[outbox.length - 1]
  if (last && last[0] === cc && !isBtn(cc)) last[1] = v; else outbox.push([cc, v])
  update()
  if (!flushing) { flushing = true; requestAnimationFrame(flush) }
}
const flush = async () => {
  const batch = outbox; outbox = []
  try { await fetch('cc', { method: 'POST', body: JSON.stringify(batch), keepalive: true }) } catch (e) {}
  flushing = false
  if (outbox.length) { flushing = true; requestAnimationFrame(flush) }
}

// ---- the Launchkey row sends as the device would: controls (coalesced per frame) and keys / pads ----
let lkOut = {}, lkFlushing = false
const lkMine = {}
const lkSend = (n, v) => {
  S.lk[n] = v; lkMine[n] = performance.now(); lkOut[n] = v; S.lkLive = performance.now(); update()
  if (!lkFlushing) { lkFlushing = true; requestAnimationFrame(async () => {
    const cc = Object.entries(lkOut).map(([k, x]) => [+k, x]); lkOut = {}
    try { await fetch('lk', { method: 'POST', body: JSON.stringify({ cc }), keepalive: true }) } catch (e) {}
    lkFlushing = false
  }) }
}
const lkNote = (note, chan) => {   // chan 0-based: 9 = drum pads; velocity 100
  fetch('lk', { method: 'POST', body: JSON.stringify({ note: [note, 100, chan] }), keepalive: true }).catch(() => {})
}
const hasLk = () => Object.keys(tags()).some(k => k.startsWith('lk.'))
const LK_CTLS = [['level', 1], ...[1, 2, 3, 4, 5, 6, 7, 8].map(n => ['k' + n, 20 + n])]   // knobs: CC 21-28 (the Launchkey's default)
const BLACK = [1, 3, 6, 8, 10]
const NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B']
// computer keyboard (physical keys, any layout): the A row = white keys from C, the row above = black keys
const KEYMAP = { KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7, KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11,
  KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16 }
const lkLight = key => { S.lkLit.set(key, performance.now()); update(); setTimeout(update, 220) }
const lkHtml = () => {
  if (!hasLk()) return ''
  const knob = ([key, n]) => {
    const [name, desc] = (tags()['lk.' + key] ?? key).split(' | ')
    const kind = key === 'level' ? 'fader' : 'knob'
    return '<div class="cell ' + kind + ' r3 ctl" data-lk="' + n + '" title="' + esc(desc ?? '') + '">' +
      (kind === 'fader' ? '<div class=bar><i></i></div>' : knobSvg()) + '<span>' + esc(name) + '</span></div>'
  }
  const keys = [...Array(25).keys()].map(i => '<i data-key="' + i + '"></i>').join('')
  // pads as on the device: top row 40-43 + 48-51, bottom row 36-39 + 44-47
  const pads = [[40, 41, 42, 43, 48, 49, 50, 51], [36, 37, 38, 39, 44, 45, 46, 47]].flat().map(n => '<i data-pad="' + n + '"><span>' +
    esc(S.layout?.lkPads?.[n - 36] ?? (n - 35)) + '</span></i>').join('')
  return '<section class=lk id=lk><h2>Launchkey</h2><div class=lkbody><div class=lkmain><div class=lkrow>' +
    LK_CTLS.slice(1).map(knob).join('') + '</div><div class=lkplay><div class=lkoct><button data-oct="-24">◀ oct</button>' +
    '<button data-oct="24">oct ▶</button></div><div class=lkkeys>' + keys + '</div><div class=lkpads>' + pads + '</div></div></div>' +
    knob(LK_CTLS[0]) + '</div></section>'
}
const lkAttach = root => {
  for (const el of root.querySelectorAll('[data-lk]')) {
    const n = +el.dataset.lk, isFader = n === 1
    if (isFader) {
      const bar = el.querySelector('.bar')
      const at = e => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (r.bottom - e.clientY) / r.height)) }
      el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); lkSend(n, at(e)) })
      el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) lkSend(n, at(e)) })
    } else {
      let y0 = 0, v0 = 0
      el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); y0 = e.clientY; v0 = S.lk[n] ?? 0 })
      el.addEventListener('pointermove', e => {
        if (!el.hasPointerCapture(e.pointerId)) return
        lkSend(n, Math.min(1, Math.max(0, v0 + (y0 - e.clientY) / (e.shiftKey ? 800 : 200))))
      })
      el.addEventListener('dblclick', () => lkSend(n, 0))
    }
    el.addEventListener('wheel', e => { e.preventDefault(); lkSend(n, Math.min(1, Math.max(0, (S.lk[n] ?? 0) - Math.sign(e.deltaY) * (e.shiftKey ? 0.005 : 0.02)))) }, { passive: false })
  }
  for (const el of root.querySelectorAll('[data-key]')) el.addEventListener('pointerdown', e => { e.preventDefault(); lkNote(S.lkBase + +el.dataset.key, 0) })
  for (const el of root.querySelectorAll('[data-pad]')) el.addEventListener('pointerdown', e => { e.preventDefault(); lkNote(+el.dataset.pad, 9) })
  for (const el of root.querySelectorAll('[data-oct]')) el.addEventListener('click', () => { S.lkBase = Math.min(96, Math.max(24, S.lkBase + +el.dataset.oct)); update() })
}
document.addEventListener('keydown', e => {
  if (!hasLk() || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return
  if (e.code === 'KeyZ' || e.code === 'KeyX') { S.lkBase = Math.min(96, Math.max(24, S.lkBase + (e.code === 'KeyX' ? 24 : -24))); update(); return }
  if (e.code in KEYMAP) { e.preventDefault(); lkNote(S.lkBase + KEYMAP[e.code], 0) }
})

// ---- building the page once per layout; values are updated in place (a drag keeps its element) ----
const cells = []   // { el, page, n, row, cc }
const build = () => {
  const root = document.getElementById('lc')
  cells.length = 0
  root.innerHTML = '<div class=pages>' + PAGES.map(page => {
    const title = tags()[PREFIX[page]] ?? (page === 'jojo' ? 'Mode 1' : 'Mode 2')
    const cols = [1, 2, 3, 4, 5, 6, 7, 8]
    return '<section class=page data-page=' + page + '><h2>' + esc(shortTitle(title)) + '</h2><div class=grid>' +
      cols.map(n => '<div class="col' + (isGlobal(n) ? ' g' : '') + '">' +
        esc((tags()[PREFIX[page] + ':' + n] ?? (isGlobal(n) ? 'Global' : '')).replace(/^\d+\s*/, '')) + '</div>').join('') +
      ROWS.map(row => cols.map(n => '<div data-cell="' + page + ':' + n + ':' + row + '"></div>').join('')).join('') + '</div></section>'
  }).join('') + '</div>' + lkHtml() + '<div class=head id=head></div>'
  lkAttach(root)
  for (const div of root.querySelectorAll('[data-cell]')) {
    const [page, n0, row] = div.dataset.cell.split(':'), n = +n0
    const [name, desc] = (tagOf(page, n, row) ?? '').split(' | ')
    const c = { el: div, page, n, row, cc: ccOf(page, n, row), on: ported(page, n) && !!tagOf(page, n, row) }
    div.title = desc ?? ''
    const kind = row === 'fader' ? 'fader' : row[0] === 'k' ? 'knob' : 'btn'
    div.className = 'cell ' + kind + (kind === 'knob' ? ' r' + row[1] : kind === 'btn' ? ' ' + row : '') + (isGlobal(n) ? ' g' : '') + (c.on ? ' ctl' : ' off')
    div.innerHTML = kind === 'fader' ? '<div class=bar><i></i></div><span>' + esc(name) + '</span>'
      : kind === 'knob' ? knobSvg() + '<span>' + esc(name) + '</span>'
      : '<span>' + esc(name) + '</span>'
    c.name = name ?? ''
    if (c.on) attach(c, kind)
    cells.push(c)
  }
  update()
}

// ---- interaction ----
const attach = (c, kind) => {
  const el = c.el
  if (kind === 'btn') {
    el.addEventListener('pointerdown', e => {
      e.preventDefault()
      if (e.shiftKey || held.has(c.cc)) {   // Shift-click: keep held; the next click lets go
        if (held.has(c.cc)) { held.delete(c.cc); send(c.cc, 0) } else { held.add(c.cc); send(c.cc, 1) }
        return
      }
      el.setPointerCapture(e.pointerId)
      send(c.cc, 1)
    })
    const up = () => { if (!held.has(c.cc) && S.cc[c.cc] > 0.5) send(c.cc, 0) }
    el.addEventListener('pointerup', up)
    el.addEventListener('pointercancel', up)
    el.addEventListener('lostpointercapture', up)
    return
  }
  if (kind === 'fader') {
    const bar = el.querySelector('.bar')
    const at = e => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (r.bottom - e.clientY) / r.height)) }
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); send(c.cc, at(e)) })
    el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) send(c.cc, at(e)) })
  } else {
    let y0 = 0, v0 = 0
    el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); y0 = e.clientY; v0 = shownOf(c.cc) })
    el.addEventListener('pointermove', e => {
      if (!el.hasPointerCapture(e.pointerId)) return
      const range = e.shiftKey ? 800 : 200   // pixels for the whole knob travel
      send(c.cc, Math.min(1, Math.max(0, v0 + (y0 - e.clientY) / range)))
    })
    el.addEventListener('dblclick', () => send(c.cc, 0))
  }
  el.addEventListener('wheel', e => { e.preventDefault(); send(c.cc, Math.min(1, Math.max(0, shownOf(c.cc) - Math.sign(e.deltaY) * (e.shiftKey ? 0.005 : 0.02)))) }, { passive: false })
}

// the value a control shows: what the track really uses (a lab column keeps its start values until moved: state.shown),
// except right after an own move (then the dragged value)
const shownOf = cc => (performance.now() - (mine[cc] ?? -1e9) < 300) ? (S.cc[cc] ?? 0) : (S.state?.shown?.[cc] ?? S.cc[cc] ?? 0)

// ---- drawing values ----
let timer = null
const update = () => { timer ??= requestAnimationFrame(() => { timer = null; draw() }) }
const pending = (now, next) => esc(now) + (next !== undefined && next !== now ? '<span class=next> → ' + esc(next) + '</span>' : '')
const draw = () => {
  if (!S.layout) return
  // frame on the page last moved: only with at most one Launch Control (with two, each board has its own page)
  const lcs = S.midi.filter(p => p[1] === 'lc').length
  for (const p of document.querySelectorAll('.page')) p.classList.toggle('live', lcs < 2 && p.dataset.page === S.page)
  for (const c of cells) {
    if (!c.on) continue
    const v = S.cc[c.cc] ?? 0
    // the track may rename a control or show its own value text (keys with Sound on: the sound mix) or dim it (unused)
    const name = S.state?.names?.[c.cc]
    if (c.row === 'b1' || c.row === 'b2') {
      let now, next, on = v > 0.5
      if (isGlobal(c.n)) {
        const g = S.state?.global ?? {}
        ;[now, next] = g[c.row] ?? ['', '']
        if (c.row === 'b2') on = on || !!g.b2on
      } else if (c.row === 'b1') [now, next] = S.state?.rows?.[c.page + ':' + c.n] ?? ['', '']
      else {   // button 2: the track's text (Lift 40 %, Sound on …) or 'held'
        now = S.state?.labels?.[c.cc] ?? (v > 0.5 ? 'held' : '')
        on = on || !!S.state?.on?.[c.cc]
      }
      // button 1 (and Chapter): the active pattern's name, blinking while a switch waits for the bar / phrase;
      // button 2: its function name (or the track's text), in accent while active
      const waiting = next !== undefined && next !== '' && next !== now
      const text = c.row === 'b1' ? (waiting ? next : now) || name || c.name : (S.state?.labels?.[c.cc] ?? name ?? c.name)
      c.el.classList.toggle('on', on || held.has(c.cc))
      c.el.classList.toggle('blink', c.row === 'b1' && waiting)
      const span = c.el.querySelector('span')
      if (span.textContent !== text) span.textContent = text
      continue
    }
    const sv = shownOf(c.cc)
    if (c.row === 'fader') c.el.style.setProperty('--v', sv); else setKnob(c.el, sv)
    const label = name ?? c.name, span = c.el.querySelector('span')
    if (span.textContent !== label) span.textContent = label
  }
  // Launchkey row: values, the keyboard window, lit keys / pads, frame while it is the last thing moved
  const lk = document.getElementById('lk')
  if (lk) {
    const now = performance.now(), lit = k => now - (S.lkLit.get(k) ?? -1e9) < 200
    lk.classList.toggle('live', now - S.lkLive < 4000)
    for (const el of lk.querySelectorAll('[data-lk]')) { const v = S.lk[el.dataset.lk] ?? 0; if (el.classList.contains('fader')) el.style.setProperty('--v', v); else setKnob(el, v) }
    for (const el of lk.querySelectorAll('[data-key]')) {
      const m = S.lkBase + +el.dataset.key
      el.className = (BLACK.includes(m % 12) ? 'blk' : 'wht') + (lit('k' + m) ? ' on' : '')
      el.textContent = m % 12 === 0 ? 'C' + (m / 12 - 1) : ''
    }
    for (const el of lk.querySelectorAll('[data-pad]')) el.classList.toggle('on', lit('p' + el.dataset.pad))
  }
  const marks = (n, on) => [...Array(n).keys()].map(k => '<i' + (k === on ? ' class=on' : '') + '></i>').join('')
  const bt = S.beat
  const beat = !bt ? '–' : ((bt.bar % 8) + 1) + ' / 8<span class=bars>' + marks(8, bt.bar % 8) + '</span><span class=beats>' +
    marks(4, bt.beat) + '</span>' + (bt.chord ? '<span class=chord>' + esc(bt.chord) + '</span>' : '')
  const gk = ['k1', 'k2', 'k3'].map(r => [(tags()['g.' + r] ?? r).split(' | ')[0], S.cc[CC_ROW[r] + 8]]).filter(([, v]) => v > 0.01)
  document.getElementById('head').innerHTML =
    (!S.bridge ? '<span class=warn>Bridge not reachable</span>' : !S.sc ? '<span class=warn>SuperCollider not running</span>' : '') +
    (S.state?.head ?? []).map(([k, now, next]) => '<div><span class=k>' + esc(k) + '</span>' + pending(now, next) + '</div>').join('') +
    '<div><span class=k>Bar</span>' + beat + '</div>' +
    gk.map(([k, v]) => '<div class=next><span class=k>' + esc(k) + '</span>' + Math.round(v * 100) + '</div>').join('') +
    '<div class=ports>' + (lcs ? lcs + ' Launch Control' + (lcs > 1 ? 's' : '') : 'no Launch Control: mouse only') + '</div>' +
    '<div><button class=theme id=theme title="Panel theme (also in the player: Visual settings, key T)">' + themeLabel() + '</button></div>' +
    '<div class=help>drag knobs · click faders · Shift-click holds a button' + (hasLk() ? ' · keys A–K, octave Z / X' : '') + '</div>'
}

// ---- live state from the bridge ----
const connect = () => {
  const es = new EventSource('events')
  es.onopen = () => { S.bridge = true; update() }
  es.onerror = () => { S.bridge = false; update() }
  es.onmessage = e => {
    const { type, data } = JSON.parse(e.data)
    if (type === 'layout') { const first = !S.layout || JSON.stringify(S.layout) !== JSON.stringify(data); S.layout = data; document.title = data.name + ' · LC XL 3'; if (first) build() }
    else if (type === 'ccs') { data.forEach((v, i) => { if (!(performance.now() - (mine[i] ?? -1e9) < 300)) S.cc[i] = v }) }
    else if (type === 'cc') {
      for (const [cc, v] of Object.entries(data)) if (!(performance.now() - (mine[cc] ?? -1e9) < 300)) { S.cc[+cc] = v; S.page = pageOfCc(+cc) }
    }
    else if (type === 'state') S.state = data
    else if (type === 'beat') S.beat = data
    else if (type === 'midi') S.midi = data
    else if (type === 'sc') S.sc = data
    else if (type === 'lk') { for (const [k, v] of Object.entries(data)) if (!(performance.now() - (lkMine[k] ?? -1e9) < 300)) S.lk[k] = v }
    else if (type === 'lkcc') { const [k, v] = data; if (!(performance.now() - (lkMine[k] ?? -1e9) < 300)) { S.lk[k] = v; S.lkLive = performance.now() } }
    else if (type === 'lknote') {   // a key or pad played (device or UI): light it; a key outside the window moves it
      const [note, chan] = data
      if (chan === 9) lkLight('p' + note)
      else { if (note < S.lkBase || note > S.lkBase + 24) S.lkBase = 12 * Math.floor(note / 12); lkLight('k' + note) }
      S.lkLive = performance.now()
    }
    update()
  }
}
document.addEventListener('click', e => { if (e.target.closest?.('#theme')) setTheme(document.body.dataset.theme === 'te' ? 'black' : 'te') })
connect()
</script>
</body>
