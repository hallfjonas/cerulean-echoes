<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LC mirror</title>
<style>
/* Layout drawn on a 1600 x 900 design board and scaled to fit the screen in both directions.
   Text has a floor and a ceiling. Two themes: black (Torso-like) and te (Teenage Engineering-like). */
:root { --W: 1600; --H: 900; }
body.black { --bg: #0b0b0b; --text: #F1EFE8; --off: #5F5E5A; --track: #2C2C2A; --handle: #F1EFE8; --acc: #F1EFE8;
  --font: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
body.te { --bg: #D3D1C7; --text: #2C2C2A; --off: #888780; --track: #B4B2A9; --handle: #D85A30; --acc: #D85A30;
  --font: -apple-system, "Helvetica Neue", Helvetica, Arial, "DejaVu Sans", sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); }
body {
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font); line-height: 1.4;
  --px: min(calc(96vw / var(--W)), calc(94vh / var(--H)));
  --fs-name: clamp(13px, calc(20 * var(--px)), 32px);
  --fs-btn:  clamp(11px, calc(18 * var(--px)), 28px);
  --fs-lab:  clamp(11px, calc(16 * var(--px)), 24px);
  --fs-knob: clamp(11px, calc(14 * var(--px)), 21px);
}
.board { width: calc(var(--W) * var(--px)); display: flex; flex-direction: column; gap: calc(32 * var(--px)); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: calc(40 * var(--px)); }
.lab { font-size: var(--fs-lab); color: var(--off); margin: 0 0 calc(8 * var(--px)) calc(12 * var(--px)); }
.pn { padding: calc(14 * var(--px)) calc(12 * var(--px)); border: 1px solid transparent; border-radius: calc(10 * var(--px)); }
.pn.last { border-color: var(--track); }
body.te .pn.last { border-color: var(--text); }
.gr { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: calc(4 * var(--px)); align-items: start; }
.cl { display: flex; flex-direction: column; align-items: center; min-width: 0; gap: calc(10 * var(--px)); }
.cl.global { box-shadow: -1px 0 0 0 var(--track); }
.name { font-size: var(--fs-name); font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; max-width: 100%; }
.kw { display: flex; flex-direction: column; align-items: center; gap: calc(3 * var(--px)); min-width: 0; max-width: 100%; }
.kl { font-size: var(--fs-knob); line-height: 1.2; color: var(--off); white-space: nowrap; overflow: hidden; max-width: 100%; }
.knob { width: calc(48 * var(--px)); aspect-ratio: 1; display: block; }
body.te .knob { width: calc(52 * var(--px)); }
.fader { position: relative; width: calc(28 * var(--px)); height: calc(150 * var(--px)); margin-top: calc(4 * var(--px)); }
.fader .bar { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: max(2px, calc(4 * var(--px))); background: var(--track); }
.fader .handle { position: absolute; left: 0; width: 100%; height: calc(12 * var(--px)); bottom: calc(var(--v) * 138 * var(--px)); background: var(--handle); border-radius: 1px; }
.btns { display: flex; flex-direction: column; align-items: center; gap: calc(4 * var(--px)); }
.btn { font-size: var(--fs-btn); white-space: nowrap; overflow: hidden; max-width: 100%; color: var(--off); }
.btn.on { color: var(--text); }
.btn.on2 { color: var(--acc); }
/* bottom row: Launchkey under mode 1, spectrum under mode 2 */
.lk { display: grid; grid-template-columns: calc(60 * var(--px)) 1fr; gap: calc(24 * var(--px)); align-items: end; padding: 0 calc(12 * var(--px)); }
.lkc { display: flex; flex-direction: column; align-items: center; gap: calc(12 * var(--px)); }
.pad { width: calc(36 * var(--px)); aspect-ratio: 1; border: 1px solid var(--off); border-radius: calc(4 * var(--px)); }
.pad.hit { background: var(--text); border-color: var(--text); }
body.te .pad { border: none; background: var(--track); border-radius: 50%; }
body.te .pad.hit { background: var(--handle); }
.wheel { display: flex; flex-direction: column; align-items: center; gap: calc(12 * var(--px)); }
.spec { padding: 0 calc(12 * var(--px)); }
.spec canvas { display: block; width: 100%; height: calc(190 * var(--px)); }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) calc(300 * var(--px)); gap: calc(28 * var(--px)); }
.setv canvas { display: block; width: 100%; height: calc(190 * var(--px)); }
body.no-lk .lkbox { visibility: hidden; }
@keyframes bl { 0%, 49% { opacity: 1 } 50%, 100% { opacity: .25 } }
.q { animation: bl 1s steps(1) infinite; }
</style>
</head>
<body>
<div class="board">
  <div class="pair">
    <section><p class="lab">mode 1 · foundation</p><div class="pn last"><div class="gr" id="m1"></div></div></section>
    <section><p class="lab">mode 2 · colour</p><div class="pn"><div class="gr" id="m2"></div></div></section>
  </div>
  <div class="pair">
    <section class="lkbox"><p class="lab">launchkey</p>
      <div class="lk">
        <div class="wheel"><span class="btn on">mod</span><div class="fader" style="--v:.6;height:calc(130 * var(--px))"><div class="bar"></div><div class="handle"></div></div></div>
        <div class="gr" id="lk"></div>
      </div>
    </section>
    <section class="duo">
      <div><p class="lab">spectrum</p><div class="spec"><canvas id="spec"></canvas></div></div>
      <div><p class="lab" id="setlab">set</p><div class="setv"><canvas id="setv"></canvas></div></div>
    </section>
  </div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const THEME = Q.get("theme") || "black";
const STYLE = Q.get("spec") || (THEME === "te" ? "segments" : "dots");
const FROZEN = Q.has("t");
document.body.classList.add(THEME);
if (Q.has("nolk")) document.body.classList.add("no-lk");

const M1 = [
  ["kick", .8, 1, "4/4", 0, "lift", [.3,.1,.5]], ["hats", .6, 1, "16th", 1, "open", [.6,.2,.4]],
  ["clap", .5, 0, "2+4", 0, "echo", [.4,.5,.2]], ["perc", .3, 2, "sparse", 0, "oct", [.5,.3,.6]],
  ["shaker", .45, 1, "swing", 0, "len", [.7,.2,.3]], ["ride", 0, 0, "bell", 0, "lift", [.4,.4,.4]],
  ["rumble", .35, 3, "short", 1, "duck", [.2,.6,.5]], ["global", .75, 1, "groove", 0, "break", [.3,.1,.55]]];
const M2 = [
  ["bass", .7, 1, "roots", 0, "oct", [.4,.3,.5]], ["keys", .55, 1, "stabs", 0, "lift", [.5,.4,.2]],
  ["pad", .6, 1, "warm", 1, "swell", [.3,.7,.6]], ["lead", .2, 0, "call", 0, "echo", [.6,.2,.3]],
  ["arp", .4, 1, "up", 0, "len", [.5,.3,.7]], ["vox", 0, 0, "chop", 0, "throw", [.4,.5,.4]],
  ["texture", .3, 1, "air", 0, "freeze", [.2,.6,.4]], ["global", .75, 1, "groove", 0, "break", [.3,.1,.55]]];
const R3_1 = ["length", "decay", "tail", "complex", "length", "decay", "length", ""];
const R3_2 = ["glide", "length", "attack", "length", "range", "length", "grain", ""];
const KL = (i, r3) => i === 7 ? ["fog", "thin", "tension"] : ["bright", "space", r3[i]];
const LKL = ["tone", "drive", "attack", "release", "chorus", "delay", "reverb", "width"];
const lit = s => s === 1 || s === 2;
const P = (c, r, a) => [c + r * Math.cos(a * Math.PI / 180), c + r * Math.sin(a * Math.PI / 180)];
const arc = (a0, a1) => { const [x0, y0] = P(12, 9, a0), [x1, y1] = P(12, 9, a1); return `M${x0} ${y0} A9 9 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };
const TE_ROWS = [["#378ADD", "#378ADD", "#F1EFE8"], ["#1D9E75", "#1D9E75", "#F1EFE8"], ["#F1EFE8", "#888780", "#2C2C2A"]];
function knob(v, row) {
  if (THEME === "te") {
    const [fill, ring, ptr] = TE_ROWS[row], a = 135 + 270 * v, [x0, y0] = P(13, 4, a), [x, y] = P(13, 10, a);
    return `<svg class="knob" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="${fill}" stroke="${ring}" stroke-width="1"/><line x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" stroke="${ptr}" stroke-width="2.5" stroke-linecap="round"/></svg>`;
  }
  return `<svg class="knob" viewBox="0 0 24 24" aria-hidden="true"><path d="${arc(135, 405)}" fill="none" stroke="#2C2C2A" stroke-width="3" stroke-linecap="round"/>${v > .01 ? `<path d="${arc(135, 135 + 270 * v)}" fill="none" stroke="#F1EFE8" stroke-width="3" stroke-linecap="round"/>` : ""}</svg>`;
}
const kw = (v, j, l) => `<div class="kw">${knob(v, j)}<span class="kl">${l}</span></div>`;
const col = r3 => ([nm, fv, s, pat, b2, fn, kv], i) => `<div class="cl${i === 7 ? " global" : ""}"><span class="name">${nm}</span>${kv.map((v, j) => kw(v, j, KL(i, r3)[j])).join("")}
  <div class="fader" style="--v:${fv}"><div class="bar"></div><div class="handle"></div></div>
  <div class="btns"><span class="btn${lit(s) ? " on" : ""}${s >= 2 ? " q" : ""}">${pat}</span><span class="btn${b2 ? " on2" : ""}">${fn}</span></div></div>`;
m1.innerHTML = M1.map(col(R3_1)).join(""); m2.innerHTML = M2.map(col(R3_2)).join("");
const LKV = [.5,.3,.7,.2,.6,.4,.5,.3], HIT = [2, 13];
lk.innerHTML = LKV.map((v, i) => `<div class="lkc">${kw(v, 2, LKL[i])}<div class="pad${HIT.includes(i) ? " hit" : ""}"></div><div class="pad${HIT.includes(i + 8) ? " hit" : ""}"></div></div>`).join("");

/* ---------- spectrum ---------- */
const cv = document.getElementById("spec"), ctx = cv.getContext("2d");
const C = THEME === "te"
  ? { fg: "#2C2C2A", dim: "#B4B2A9", lab: "#888780", low: "#D85A30", mid: "#1D9E75", high: "#378ADD" }
  : { fg: "#F1EFE8", bar: "#888780", dim: "#2C2C2A", lab: "#5F5E5A" };
const N = 48, FMIN = 20, FMAX = 20000;
const fAt = i => FMIN * Math.pow(FMAX / FMIN, (i + .5) / N);
const peaks = new Float32Array(N), slow = new Float32Array(N);
function energy(t) {   // demo signal: kick, bass, mids, hats; replace with analyser data
  const e = new Float32Array(N), beat = Math.pow(Math.max(0, Math.cos(t * Math.PI * 2 * 2.06)), 8);
  for (let i = 0; i < N; i++) {
    const lf = Math.log10(fAt(i));
    let v = .46 - .12 * (lf - 2);                                  // pink-ish tilt
    v += .30 * beat * Math.exp(-Math.pow((lf - 1.78) / .18, 2));   // kick ~60 Hz
    v += .14 * Math.exp(-Math.pow((lf - 2.2) / .2, 2)) * (.8 + .2 * Math.sin(t * 3));
    v += .12 * Math.exp(-Math.pow((lf - 3.9) / .15, 2)) * (.5 + .5 * Math.abs(Math.sin(t * 13)));  // hats
    v += .05 * Math.sin(i * 1.7 + t * 5) + .03 * Math.sin(i * 4.1 - t * 9);
    e[i] = Math.min(1, Math.max(0, v));
  }
  return e;
}
const bandColor = i => { if (THEME !== "te") return C.fg; const f = fAt(i); return f < 250 ? C.low : f < 4000 ? C.mid : C.high; };
function resize() {
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function labels(w, h, lh) {
  const fs = parseFloat(getComputedStyle(document.querySelector(".lab")).fontSize);
  ctx.font = `${fs}px ${getComputedStyle(document.body).fontFamily}`; ctx.fillStyle = C.lab; ctx.textBaseline = "bottom";
  for (const [f, s] of [[60, "60"], [250, "250"], [1000, "1k"], [4000, "4k"], [12000, "12k"]]) {
    const x = w * Math.log(f / FMIN) / Math.log(FMAX / FMIN);
    ctx.textAlign = "center"; ctx.fillText(s, x, h);
  }
  return fs * 1.6;
}
function draw(t) {
  const r = cv.getBoundingClientRect(), w = r.width, h = r.height;
  ctx.clearRect(0, 0, w, h);
  const lh = labels(w, h), H = h - lh, e = energy(t);
  for (let i = 0; i < N; i++) { peaks[i] = Math.max(e[i], peaks[i] - .006); slow[i] += (e[i] - slow[i]) * .05; if (FROZEN) { peaks[i] = Math.min(1, e[i] + .06); slow[i] = e[i] * .9; } }
  const bw = w / N;
  if (STYLE === "bars") {                      // thin bars + peak tick
    for (let i = 0; i < N; i++) {
      const x = i * bw + bw * .25, bwi = bw * .5;
      ctx.fillStyle = C.dim; ctx.fillRect(x, 0, bwi, H);
      ctx.fillStyle = C.bar || C.fg; ctx.fillRect(x, H - e[i] * H, bwi, e[i] * H);
      ctx.fillStyle = C.fg; ctx.fillRect(x, H - peaks[i] * H - 2, bwi, 2);
    }
  } else if (STYLE === "line") {               // live line over a slow average
    const line = (arr, col, lw) => { ctx.beginPath(); for (let i = 0; i < N; i++) { const x = (i + .5) * bw, y = H - arr[i] * H; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = "round"; ctx.stroke(); };
    ctx.fillStyle = C.dim; ctx.fillRect(0, H - 1, w, 1);
    line(slow, THEME === "te" ? C.dim : "#5F5E5A", 2); line(e, THEME === "te" ? C.low : C.fg, 2);
  } else if (STYLE === "dots" || STYLE === "segments") {   // LED matrix / stacked segments
    const rows = 12, cols = STYLE === "dots" ? 32 : 24, cw = w / cols, rh = H / rows;
    for (let c = 0; c < cols; c++) {
      const i0 = Math.floor(c * N / cols), i1 = Math.floor((c + 1) * N / cols); let v = 0;
      for (let i = i0; i < i1; i++) v = Math.max(v, e[i]);
      const on = Math.round(v * rows), col = bandColor(i0);
      for (let rr = 0; rr < rows; rr++) {
        ctx.fillStyle = rr < on ? col : C.dim;
        const y = H - (rr + 1) * rh;
        if (STYLE === "dots") { ctx.beginPath(); ctx.arc(c * cw + cw / 2, y + rh / 2, Math.min(cw, rh) * .3, 0, Math.PI * 2); ctx.fill(); }
        else { ctx.beginPath(); ctx.roundRect(c * cw + cw * .12, y + rh * .18, cw * .76, rh * .64, Math.min(cw, rh) * .2); ctx.fill(); }
      }
    }
  } else if (STYLE === "area") {               // filled shape with peak line
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let i = 0; i < N; i++) ctx.lineTo((i + .5) * bw, H - e[i] * H);
    ctx.lineTo(w, H); ctx.closePath(); ctx.fillStyle = THEME === "te" ? C.fg : C.dim; ctx.fill();
    ctx.beginPath(); for (let i = 0; i < N; i++) { const x = (i + .5) * bw, y = H - peaks[i] * H; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = THEME === "te" ? C.low : C.fg; ctx.lineWidth = 2; ctx.stroke();
  }
}
resize(); addEventListener("resize", resize);
if (FROZEN) draw(+Q.get("t")); else { const loop = ts => { draw(ts / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }

/* ---------- set view: energy of the set over time, four switchable views (key V) ---------- */
(() => {
  const VIEWS = ["ring", "map", "energy", "spectrogram"];
  let view = Q.get("set") || "ring";
  const TEm = THEME === "te";
  const SK = TEm
    ? { now: "#D85A30", data: "#2C2C2A", old: "#888780", flat: "#378ADD", lab: "#888780", grid: "#B4B2A9", bg: [211, 209, 199], ink: [44, 44, 42] }
    : { now: "#F1EFE8", data: "#888780", old: "#444441", flat: "#F1EFE8", lab: "#5F5E5A", grid: "#2C2C2A", bg: [11, 11, 11], ink: [241, 239, 232] };
  /* demo: invented 72-minute set, one sample per 10 s; replace with data from SC */
  const NOW = 72, STEP = 1 / 6, WIN = 60;
  const BR = [[13, 14], [22.5, 24], [31, 34], [51.5, 53], [66, 67]];
  const EKs = [[0, .15], [6, .3], [8, .42], [13, .5], [17, .55], [22, .7], [24, .82], [29, .78], [31, .3], [34, .45], [38, .6], [41, .62], [52, .63], [55, .72], [60, .9], [65, .86], [68, .55], [75, .2]];
  const TKs = [[0, .2], [8, .3], [13, .55], [17, .5], [22, .8], [24, .55], [29, .5], [31, .75], [34, .5], [38, .35], [41, .3], [52, .32], [53, .75], [60, .6], [65, .55], [66, .78], [68, .4], [75, .2]];
  const DKs = [[0, .8], [8, .7], [17, .55], [24, .25], [29, .3], [31, .85], [34, .75], [41, .65], [52, .6], [53, .7], [55, .45], [60, .2], [65, .25], [68, .6], [75, .7]];
  const HKs = [[0, 0], [8, 0], [9, 1], [31, 1], [32, 0], [41, 0], [42, 1], [75, 1]];
  const lk = (k, m) => { for (let i = 1; i < k.length; i++) if (m <= k[i][0]) { const [a, va] = k[i - 1], [b, vb] = k[i], u = (m - a) / (b - a); return va + (vb - va) * (u * u * (3 - 2 * u)); } return k[k.length - 1][1]; };
  const inBr = m => BR.some(([a, b]) => m >= a && m < b);
  let sd = 11; const rn = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const D = [];
  for (let m = 0; m < NOW; m += STEP) { const br = inBr(m);
    D.push({ m, e: Math.min(1, lk(EKs, m) * (br ? .55 : 1) + (rn() - .5) * .03), t: Math.min(1, lk(TKs, m) + (rn() - .5) * .03), d: Math.min(1, lk(DKs, m) + (br ? .15 : 0) + (rn() - .5) * .03) }); }
  const sm = (arr, k) => arr.map((_, i) => { const a = arr.slice(Math.max(0, i - k), i + k + 1); return a.reduce((x, y) => x + y, 0) / a.length; });
  const rgbS = a => `rgb(${a.join(",")})`;
  const cv = document.getElementById("setv"), c = cv.getContext("2d");
  function draw() {
    document.getElementById("setlab").textContent = `set · ${view}`;
    const dpr = devicePixelRatio || 1, r = cv.getBoundingClientRect(), w = r.width, h = r.height;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
    const fs = parseFloat(getComputedStyle(document.querySelector(".lab")).fontSize), F = getComputedStyle(document.body).fontFamily;
    c.font = `${fs}px ${F}`; c.lineJoin = "round";
    const E = D.map(s => s.e);
    if (view === "ring") {
      /* fixed 60′ clock in the same grid language as the spectrum: 60 spokes (1 per minute) × 8 cells,
         lit cells = round(√energy · 8); cells grow with the radius; the second hour paints over the first */
      const cx = w / 2, cy = h / 2, R1 = Math.min(w, h) / 2 - 2, R0 = R1 * .4, RINGS = 8, lap = Math.floor(NOW / 60) * 60, st = (R1 - R0) / RINGS;
      const COL = TEm ? { cur: "#2C2C2A", old: "#5F5E5A", off: "#B4B2A9" } : { cur: "#B4B2A9", old: "#5F5E5A", off: "#2C2C2A" };
      for (let k = 0; k < 60; k++) {
        const a = (-90 + (k + .5) * 6) * Math.PI / 180, mAbs = k < NOW - lap ? lap + k : lap - 60 + k, cur = mAbs >= lap;
        const ss = D.filter(s => s.m >= mAbs && s.m < mAbs + 1), me = ss.length ? ss.reduce((x, s) => x + s.e, 0) / ss.length : 0;
        const on = Math.round(Math.sqrt(me) * RINGS), isNow = mAbs === Math.floor(NOW - 1e-6);
        for (let r = 0; r < RINGS; r++) {
          const rr = R0 + (r + .5) * st, x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a), slot = rr * Math.PI / 30;
          c.fillStyle = r < on ? (isNow ? SK.now : cur ? COL.cur : COL.old) : COL.off; c.beginPath();
          if (TEm) { const tw = slot * .85 / 2 * 1; c.save(); c.translate(x, y); c.rotate(a); c.roundRect(-st * .34, -tw / 2, st * .68, tw, Math.min(tw, st) * .3); c.restore(); }
          else c.arc(x, y, Math.min(st * .32, slot / 2 * .55), 0, 7);
          c.fill(); } }
      c.fillStyle = SK.now; c.textAlign = "center"; c.textBaseline = "middle"; c.font = `${fs * 1.5}px ${F}`; c.fillText(`${NOW}′`, cx, cy);
    } else if (view === "map") {
      /* no window: the trail simply fades with age */
      const side = Math.min(w, h), x0 = (w - side) / 2, y0 = (h - side) / 2, X = e => x0 + e * side, Y = t => y0 + side - t * side;
      c.strokeStyle = SK.grid; c.lineWidth = 1; c.strokeRect(x0 + .5, y0 + .5, side - 1, side - 1);
      c.fillStyle = SK.grid; c.fillRect(x0 + side / 2, y0, 1, side); c.fillRect(x0, y0 + side / 2, side, 1);
      c.fillStyle = SK.lab; c.textBaseline = "top"; c.fillText("tense", x0 + 6, y0 + 4); c.textAlign = "right"; c.fillText("full", x0 + side - 6, y0 + 4);
      c.textBaseline = "bottom"; c.fillText("driving", x0 + side - 6, y0 + side - 4); c.textAlign = "left"; c.fillText("calm", x0 + 6, y0 + side - 4);
      const Ex = sm(E, 12), Tx = sm(D.map(s => s.t), 12), n = D.length - 1, TAU = 12;
      for (let b = 0; b < 10; b++) {             // 10 age buckets, each one path
        const a0 = b * 3, a1 = a0 + 3, alpha = Math.exp(-(a0 + 1.5) / TAU); if (alpha < .05) continue;
        c.globalAlpha = alpha; c.strokeStyle = SK.data; c.lineWidth = 1 + 2 * alpha; c.beginPath(); let st = false;
        for (let i = 0; i <= n; i++) { const age = NOW - D[i].m; if (age < a0 || age > a1 + STEP) continue; st ? c.lineTo(X(Ex[i]), Y(Tx[i])) : c.moveTo(X(Ex[i]), Y(Tx[i])); st = true; }
        c.stroke(); }
      c.globalAlpha = 1; c.strokeStyle = SK.now; c.lineWidth = 3; c.lineCap = "round"; c.beginPath();
      for (let i = n - 9; i <= n; i++) i === n - 9 ? c.moveTo(X(Ex[i]), Y(Tx[i])) : c.lineTo(X(Ex[i]), Y(Tx[i])); c.stroke();
      c.fillStyle = SK.now; c.beginPath(); c.arc(X(Ex[n]), Y(Tx[n]), 6, 0, 7); c.fill();
    } else {
      /* strips: last 60′, now at the right edge */
      const L = view === "spectrogram" ? fs * 2.2 : 0, top = 4, H = h - fs * 1.6 - 6, t0 = NOW - WIN, X = m => L + (m - t0) / WIN * (w - L);
      const vis = D.filter(s => s.m >= t0);
      if (view === "energy") {
        const area = () => { c.beginPath(); c.moveTo(X(vis[0].m), top + H); vis.forEach(s => c.lineTo(X(s.m), top + H - s.e * H)); c.lineTo(X(NOW), top + H); c.closePath(); };
        c.fillStyle = SK.data; area(); c.fill();
        c.save(); area(); c.clip(); c.strokeStyle = SK.flat; c.lineWidth = 8; let on = false;
        vis.forEach(s => { const x = X(s.m), y = top + H - s.e * H; if (s.d < .35) { if (!on) { c.beginPath(); c.moveTo(x, y); on = true; } else c.lineTo(x, y); } else if (on) { c.stroke(); on = false; } });
        if (on) c.stroke(); c.restore();
      } else {
        const ROWS = 64, N = vis.length, img = new ImageData(N, ROWS), G = Array.from({ length: ROWS }, () => new Float32Array(N));
        vis.forEach((s, i) => { const br = inBr(s.m), hat = lk(HKs, s.m), pad = (br || (s.m >= 34 && s.m < 41)) ? 1 : 0;
          for (let rr = 0; rr < ROWS; rr++) { const fr = rr / (ROWS - 1); let v = .45 * s.e - .3 * fr;
            if (!br) v += .45 * Math.exp(-(((fr - .18) / .07) ** 2)); v += .3 * s.e * Math.exp(-(((fr - .45) / .12) ** 2));
            if (!br) v += .3 * s.e * hat * Math.exp(-(((fr - .8) / .06) ** 2)); v += .22 * pad * Math.exp(-(((fr - .55) / .2) ** 2));
            G[rr][i] = Math.max(0, v); } });
        G.forEach((row, rr) => { const s2 = sm(Array.from(row), 3), mx = Math.max(...s2) || 1;
          s2.forEach((v, i) => { const a = .85 * Math.min(1, v / mx) ** 1.4, p = ((ROWS - 1 - rr) * N + i) * 4;
            for (let k = 0; k < 3; k++) img.data[p + k] = SK.bg[k] + (SK.ink[k] - SK.bg[k]) * a; img.data[p + 3] = 255; }); });
        const off = new OffscreenCanvas(N, ROWS); off.getContext("2d").putImageData(img, 0, 0);
        c.imageSmoothingEnabled = true; c.drawImage(off, X(vis[0].m), top, X(NOW) - X(vis[0].m), H);
        c.fillStyle = SK.lab; c.textAlign = "right"; c.textBaseline = "middle";
        for (const [fq, l] of [[100, "100"], [1000, "1k"], [10000, "10k"]]) c.fillText(l, L - 6, top + H - Math.log(fq / 20) / Math.log(1000) * H);
      }
      c.fillStyle = SK.lab; c.textBaseline = "top"; c.textAlign = "left"; c.fillText(`−60′`, L, top + H + 6);
      c.textAlign = "center"; c.fillText(`−30′`, X(NOW - 30), top + H + 6);
      c.fillStyle = SK.now; c.fillRect(X(NOW) - 2, top, 2.5, H); c.textAlign = "right"; c.fillText("now", w, top + H + 6);
    }
    c.textAlign = "left";
  }
  draw(); addEventListener("resize", draw);
  addEventListener("keydown", e => { if (e.key === "v" || e.key === "V") { view = VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length]; draw(); } });
})();
